        ctx.clip();
        ctx.fillStyle = colors.lip;
        ctx.fillRect(-48, 6, 96, 8);
        ctx.fillStyle = PALETTE.stripeGold;
        ctx.fillRect(-46, -1, 92, 5.5);
        ctx.restore();

        ctx.strokeStyle = PALETTE.ink;
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Dark Wheel-Well Cutout Arches
        for (const wx of [-CAR_SPEC.wheelOffsetX, CAR_SPEC.wheelOffsetX]) {
          ctx.fillStyle = PALETTE.ink;
          ctx.beginPath();
          ctx.arc(wx, 13, CAR_SPEC.wheelRadius + 3.5, Math.PI, 0);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // 4. Tires, Colored Rims & White Center Axle Dots
        for (const w of [wheelR, wheelF]) {
          ctx.save();
          ctx.translate(w.position.x, w.position.y);
          ctx.rotate(w.angle);
          ctx.fillStyle = PALETTE.ink;
          ctx.beginPath();
          ctx.arc(0, 0, CAR_SPEC.wheelRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = colors.rim;
          ctx.beginPath();
          ctx.arc(0, 0, 7.6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = PALETTE.white;
          ctx.beginPath();
          ctx.arc(0, 0, 3.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const SKYLINE_BUILDINGS = [
        { x: -10, w: 120, h: 255, back: true, cols: 3, rows: 7 },
        { x: 35, w: 110, h: 215, back: false, cols: 3, rows: 6 },
        { x: 162, w: 165, h: 318, back: true, cols: 4, rows: 9 },
        { x: 255, w: 145, h: 235, back: false, cols: 3, rows: 6 },
        { x: 348, w: 125, h: 265, back: true, cols: 3, rows: 7 },
        { x: 782, w: 145, h: 278, back: true, cols: 3, rows: 8 },
        { x: 878, w: 155, h: 225, back: false, cols: 4, rows: 6 },
        { x: 1005, w: 170, h: 305, back: true, cols: 4, rows: 9 },
        { x: 1135, w: 155, h: 245, back: false, cols: 4, rows: 7 }
      ];

      class CanvasRenderer {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.dpr = 1;
          this.smoke = [];
          this.splashes = [];
          this.popStar = null;
          this.tickCount = 0;
          this.resize();
        }

        resize() {
          this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
          this.canvas.width = Math.round(WORLD_W * this.dpr);
          this.canvas.height = Math.round(WORLD_H * this.dpr);
        }

        clearEffects() {
          this.smoke = [];
          this.splashes = [];
          this.popStar = null;
        }

        spawnExhaustPuff(carState) {
          if (!carState || carState.dead) return;
          const a = carState.chassis.angle;
          const cos = Math.cos(a);
          const sin = Math.sin(a);
          const lx = -49 * carState.facing;
          const ly = -1 - CENTER_OF_MASS_OFFSET;
          const px = carState.chassis.position.x + lx * cos - ly * sin;
          const py = carState.chassis.position.y + lx * sin + ly * cos;
          const spread = ((this.tickCount % 5) - 2) * 0.08;
          this.smoke.push({
            x: px,
            y: py,
            vx: -carState.facing * 1.25 + spread,
            vy: -0.95 - (this.tickCount % 3) * 0.2,
            r: 4,
            life: 1.0
          });
        }

        spawnWaterSplash(x) {
          for (let i = 0; i < 8; i++) {
            const ang = -Math.PI * (0.18 + (i / 7) * 0.64);
            const spd = 5 + (i % 3) * 1.8;
            this.splashes.push({
              x, y: WATER_CREST_Y,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
              r: 6 + (i % 3) * 1.5, life: 1.0
            });
          }
        }

        spawnBonkPop(x, y, color) {
          this.popStar = { x, y, color, life: 1.0 };
        }

        updateEffects(dtScale = 1, sim = null) {
          this.tickCount++;
          if (sim) {
            for (const car of [sim.p1Car, sim.p2Car]) {
              if (!car || car.dead) continue;
              const cadence = car.driving ? 4 : 26;
              if (this.tickCount % cadence === 0) this.spawnExhaustPuff(car);
            }
          }

          for (let i = this.smoke.length - 1; i >= 0; i--) {
            const s = this.smoke[i];
            s.x += s.vx * dtScale;
            s.y += s.vy * dtScale;
            s.r = lerp(s.r, 11, 0.08 * dtScale);
            s.life -= 0.042 * dtScale; // ~400ms lifetime
            if (s.life <= 0) this.smoke.splice(i, 1);
          }

          for (let i = this.splashes.length - 1; i >= 0; i--) {
            const d = this.splashes[i];
            d.vy += 0.35 * dtScale;
            d.x += d.vx * dtScale;
            d.y += d.vy * dtScale;
            d.life -= 0.03 * dtScale;
            if (d.life <= 0) this.splashes.splice(i, 1);
          }

          if (this.popStar) {
            this.popStar.life -= 0.045 * dtScale;
            if (this.popStar.life <= 0) this.popStar = null;
          }
        }

        _drawSkyAndCity(ctx) {
          // Two-Tone Pastel Sunset Sky
          ctx.fillStyle = PALETTE.skyPeach;
          ctx.fillRect(0, 0, WORLD_W, 338);
          ctx.fillStyle = PALETTE.horizonMauve;
          ctx.fillRect(0, 338, WORLD_W, WORLD_H - 338);

          // Center Pale Cream Sun Glow Block tucked cleanly along horizon
          ctx.fillStyle = PALETTE.sunCream;
          ctx.fillRect(545, 315, 190, 145);

          // Flat Back & Front City Skyline Silhouettes + Window Grids (zero outlines)
          for (const backPass of [true, false]) {
            for (const b of SKYLINE_BUILDINGS) {
              if (b.back !== backPass) continue;
              const topY = WATER_CREST_Y - b.h;
              ctx.fillStyle = b.back ? PALETTE.cityBack : PALETTE.cityFront;
              ctx.fillRect(b.x, topY, b.w, b.h + 4);

              ctx.fillStyle = PALETTE.cityWindow;
              const padX = 16;
              const gapX = 9;
              const winW = (b.w - padX * 2 - gapX * (b.cols - 1)) / b.cols;
              const winH = 9;
              const rowStep = 22;
              for (let r = 0; r < b.rows; r++) {
                const wy = topY + 18 + r * rowStep;
                if (wy + winH > WATER_CREST_Y - 12) break;
                for (let c = 0; c < b.cols; c++) {
                  ctx.fillRect(b.x + padX + c * (winW + gapX), wy, winW, winH);
                }
              }
            }
          }
        }

        _fillRockAndClipPills(ctx, path, fillRule, pills) {
          ctx.fillStyle = PALETTE.rockFill;
          ctx.fill(path, fillRule);
          ctx.save();
          ctx.clip(path, fillRule);
          ctx.fillStyle = PALETTE.rockPill;
          for (const p of pills) {
            ctx.beginPath();
            drawRoundedRectPath(ctx, p.x, p.y, p.w, p.h, p.h * 0.5);
            ctx.fill();
          }
          ctx.restore();
        }

        _drawArenaTerrain(ctx, sim) {
          const arena = ARENAS[sim.arenaIndex];
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Floating Islands
          for (const isl of arena.islands) {
            const path = new Path2D();
            tracePointLoop(path, isl.poly, true);
            this._fillRockAndClipPills(ctx, path, 'nonzero', arena.pills);
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 4.5;
            ctx.stroke(path);
          }

          // Enclosed Cave Interiors (single seamless evenodd cutout)
          for (const caveLoop of arena.caves) {
            const fillPath = new Path2D();
            fillPath.rect(-25, -25, WORLD_W + 50, WORLD_H + 50);
            tracePointLoop(fillPath, caveLoop, true);
            this._fillRockAndClipPills(ctx, fillPath, 'evenodd', arena.pills);

            const rimPath = new Path2D();
            tracePointLoop(rimPath, caveLoop, true);
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 4.5;
            ctx.stroke(rimPath);
          }

          // Open-Skylight Cavern Arches & Canyons
          for (const openRock of arena.openRocks) {
            const fillPath = new Path2D();
            tracePointLoop(fillPath, openRock.visualPoly, true);
            this._fillRockAndClipPills(ctx, fillPath, 'nonzero', arena.pills);

            const rimPath = new Path2D();
            tracePointLoop(rimPath, openRock.surface, false);
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 4.5;
            ctx.stroke(rimPath);
          }

          // Thin U/C Half-Pipe Bowls with mathematically exact rounded semicircle endcaps
          for (const pipe of arena.halfPipes) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = pipe.thickness + 9;
            ctx.beginPath();
            ctx.arc(pipe.cx, pipe.cy, pipe.r, pipe.aStart, pipe.aEnd, false);
            ctx.stroke();

            ctx.strokeStyle = PALETTE.rockFill;
            ctx.lineWidth = pipe.thickness;
            ctx.beginPath();
            ctx.arc(pipe.cx, pipe.cy, pipe.r, pipe.aStart, pipe.aEnd, false);
            ctx.stroke();
            ctx.restore();
          }

          // Overhead / Deflector Rock Blocks
          for (const blk of arena.blocks) {
            if (blk.hiddenVisual) continue;
            ctx.save();
            ctx.translate(blk.x, blk.y);
            ctx.rotate(blk.angle || 0);
            ctx.fillStyle = PALETTE.rockFill;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            drawRoundedRectPath(ctx, -blk.w * 0.5, -blk.h * 0.5, blk.w, blk.h, blk.chamfer || 4);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          // Dynamic Wooden Seesaws + Center Dark Slate Pivot Pins (r=11px, no outline)
          for (const sw of sim.seesaws) {
            ctx.save();
            ctx.translate(sw.body.position.x, sw.body.position.y);
            ctx.rotate(sw.body.angle);
            ctx.fillStyle = PALETTE.plankFill;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            drawRoundedRectPath(ctx, -sw.w * 0.5, -14, sw.w, 28, 14);
            ctx.fill();
            ctx.stroke();

            // Solid #3A3E42 circular center pivot pin (radius 11px, no outline)
            ctx.fillStyle = PALETTE.rockPill;
            ctx.beginPath();
            ctx.arc(0, 0, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        _drawWaterWaves(ctx, timeMs) {
          const waveY = (x, offset) => WATER_CREST_Y + Math.sin((x / 55) * Math.PI * 2 + timeMs * 0.0045 + offset) * 6;

          ctx.fillStyle = PALETTE.waterTop;
          ctx.beginPath();
          ctx.moveTo(0, WORLD_H);
          for (let x = 0; x <= WORLD_W; x += 4) ctx.lineTo(x, waveY(x, 0) - 2);
          ctx.lineTo(WORLD_W, WORLD_H);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = PALETTE.waterDeep;
          ctx.beginPath();
          ctx.moveTo(0, WORLD_H);
          for (let x = 0; x <= WORLD_W; x += 4) ctx.lineTo(x, waveY(x, 1.8) + 16);
          ctx.lineTo(WORLD_W, WORLD_H);
          ctx.closePath();
          ctx.fill();
        }

        _drawEffects(ctx, bannerText) {
          // Flat white exhaust puffs
          for (const s of this.smoke) {
            ctx.fillStyle = `rgba(245, 245, 250, ${(s.life * 0.72).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }

          // Water splash droplets
          for (const d of this.splashes) {
            ctx.fillStyle = PALETTE.waterTop;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r * d.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }

          // Cartoon KO Bonk Star
          if (this.popStar) {
            const { x, y, life } = this.popStar;
            const s = (1.3 - life * 0.4) * 32;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = PALETTE.stripeGold;
            ctx.strokeStyle = PALETTE.ink;
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = 0; i < 12; i++) {
              const rad = i % 2 === 0 ? s : s * 0.48;
              const ang = (i / 12) * Math.PI * 2;
              if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
              else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          if (bannerText) {
            ctx.save();
            ctx.font = '800 54px "Fredoka", "Rubik", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 10;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = PALETTE.ink;
            ctx.strokeText(bannerText, WORLD_W * 0.5, 138);
            ctx.fillStyle = PALETTE.white;
            ctx.fillText(bannerText, WORLD_W * 0.5, 138);
            ctx.restore();
          }
        }

        render(sim, bannerText = '') {
          const ctx = this.ctx;
          ctx.save();
          ctx.scale(this.dpr, this.dpr);

          this._drawSkyAndCity(ctx);
          this._drawArenaTerrain(ctx, sim);
          if (sim.p1Car) drawRoadster(ctx, sim.p1Car, true);
          if (sim.p2Car) drawRoadster(ctx, sim.p2Car, false);
          this._drawWaterWaves(ctx, performance.now());
          this._drawEffects(ctx, bannerText);

          ctx.restore();
        }
      }

      // =========================================================================
      // 6. SMART AI OPPONENT
      // =========================================================================
      class SmartAI {
        constructor() {
          this.flipBias = 0;
          this.decisionTick = 0;
        }

        decide(sim, aiIsP1 = false) {
          const me = aiIsP1 ? sim.p1Car : sim.p2Car;
          const opp = aiIsP1 ? sim.p2Car : sim.p1Car;
          if (!me || !opp || me.dead) return { l: false, r: false };

          this.decisionTick++;
          const mx = me.chassis.position.x;
          const my = me.chassis.position.y;
          const ox = opp.chassis.position.x;
          const oy = opp.chassis.position.y;
          const angle = normalizeAngle(me.chassis.angle);
          const gx = me.playerIndex === 1 ? sim.grounded.p1R || sim.grounded.p1F : sim.grounded.p2R || sim.grounded.p2F;

          // Edge safety near water chasm
          if (mx < 220 && me.chassis.velocity.x < 0) return { l: false, r: true };
          if (mx > 1060 && me.chassis.velocity.x > 0) return { l: true, r: false };

          if (!gx && my < 480) {
            if (this.decisionTick % 24 === 0) this.flipBias = ((this.decisionTick / 24) % 3) * 0.35;
            if (Math.abs(angle) > 0.65) return angle > 0 ? { l: true, r: false } : { l: false, r: true };
            if (Math.abs(ox - mx) < 160 && this.flipBias < 0.55) {
              return ox < mx ? { l: true, r: false } : { l: false, r: true };
            }
            return { l: false, r: false };
          }

          if (Math.abs(angle) > 1.35) return angle > 0 ? { l: true, r: false } : { l: false, r: true };

          if (ox < mx - 35) return { l: true, r: false };
          if (ox > mx + 35) return { l: false, r: true };
          return oy < my ? { l: me.facing > 0, r: me.facing < 0 } : { l: ox < mx, r: ox >= mx };
        }
      }

      // =========================================================================
      // 7. UNIFIED CROSS-PLATFORM INPUT CONTROLLER (KEYBOARD + ANDROID POINTERS)
      // =========================================================================
      class InputManager {
        constructor(sound) {
          this.sound = sound;
          this.state = { p1_l: false, p1_r: false, p2_l: false, p2_r: false };
          this.pressTimes = { p1_l: 0, p1_r: 0, p2_l: 0, p2_r: 0 };
          this.heldCodes = new Map(); // code -> { key, startTime }
          this.activePointers = new Map(); // pointerId -> { key, startTime }
          this.singleLayout = localStorage.getItem('crashahead_1p_layout') || 'split';
          this.mode = 'menu';

          this.dom = {
            root: document.getElementById('touch-controls'),
            groupP1: document.getElementById('group-p1'),
            groupP2: document.getElementById('group-p2'),
            p1L: document.getElementById('pad-p1-l'),
            p1R: document.getElementById('pad-p1-r'),
            p2L: document.getElementById('pad-p2-l'),
            p2R: document.getElementById('pad-p2-r')
          };

          this.pads = [
            { el: this.dom.p1L, key: 'p1_l' },
            { el: this.dom.p1R, key: 'p1_r' },
            { el: this.dom.p2L, key: 'p2_l' },
            { el: this.dom.p2R, key: 'p2_r' }
          ];

          this._bindKeyboard();
          this._bindUnifiedPointers();
          this.setMode('menu');
        }

        _mapKeyCodeToAction(code) {
          if (this.mode === 'local') {
            if (code === 'KeyA' || code === 'KeyS') return 'p1_l';
            if (code === 'KeyD' || code === 'KeyW') return 'p1_r';
            if (code === 'ArrowLeft' || code === 'ArrowUp') return 'p2_l';
            if (code === 'ArrowRight' || code === 'ArrowDown') return 'p2_r';
            return null;
          }
          if (this.mode === 'online_client') {
            if (code === 'KeyA' || code === 'ArrowLeft' || code === 'KeyW' || code === 'ArrowUp') return 'p2_l';
            if (code === 'KeyD' || code === 'ArrowRight' || code === 'KeyS' || code === 'ArrowDown') return 'p2_r';
            return null;
          }
          // Single-player / Online Host (Red facing right)
          if (code === 'KeyA' || code === 'ArrowLeft' || code === 'KeyS' || code === 'ArrowDown') return 'p1_l';
          if (code === 'KeyD' || code === 'ArrowRight' || code === 'KeyW' || code === 'ArrowUp') return 'p1_r';
          return null;
        }

        _recomputeState() {
          const next = { p1_l: false, p1_r: false, p2_l: false, p2_r: false };
          const earliest = { p1_l: 0, p1_r: 0, p2_l: 0, p2_r: 0 };

          const applyEntry = (key, startTime) => {
            if (!key) return;
            next[key] = true;
            if (earliest[key] === 0 || startTime < earliest[key]) earliest[key] = startTime;
          };

          for (const entry of this.heldCodes.values()) applyEntry(entry.key, entry.startTime);
          for (const entry of this.activePointers.values()) applyEntry(entry.key, entry.startTime);

          Object.assign(this.state, next);
          Object.assign(this.pressTimes, earliest);
          this._syncVisuals();
        }

        _clearAllInputs() {
          this.heldCodes.clear();
          this.activePointers.clear();
          this._recomputeState();
        }

        _bindKeyboard() {
          window.addEventListener('keydown', (e) => {
            if (
              document.activeElement &&
              document.activeElement.tagName === 'INPUT' &&
              !document.activeElement.closest('.hidden')
            ) return;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
              e.preventDefault();
            }
            const actionKey = this._mapKeyCodeToAction(e.code);
            if (!actionKey) return;
            this.sound.unlock();
            if (!this.heldCodes.has(e.code)) {
              this.heldCodes.set(e.code, { key: actionKey, startTime: performance.now() });
              this._recomputeState();
            }
          });

          window.addEventListener('keyup', (e) => {
            if (this.heldCodes.delete(e.code)) {
              this._recomputeState();
            }
          });

          window.addEventListener('blur', () => this._clearAllInputs());
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) this._clearAllInputs();
          });
        }

        _isPadVisible(el) {
          if (!el || el.closest('.hidden')) return false;
          const style = window.getComputedStyle(el);
          if (style.display === 'none' || style.visibility === 'hidden') return false;
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0;
        }

        _padKeyAtPoint(x, y) {
          for (const p of this.pads) {
            if (!this._isPadVisible(p.el)) continue;
            const r = p.el.getBoundingClientRect();
            if (x >= r.left - 10 && x <= r.right + 10 && y >= r.top - 10 && y <= r.bottom + 10) {
              return p.key;
            }
          }
          return null;
        }

        _bindUnifiedPointers() {
          // Suppress Android Chrome long-press context menu on hold
          this.dom.root.addEventListener('contextmenu', (e) => e.preventDefault());

          for (const p of this.pads) {
            p.el.addEventListener('contextmenu', (e) => e.preventDefault());

            p.el.addEventListener('pointerdown', (e) => {
              if (this.mode === 'menu') return;
              if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
              e.preventDefault();
              this.sound.unlock();
              try {
                if (this.mode !== 'local' && p.el.setPointerCapture) {
                  p.el.setPointerCapture(e.pointerId);
                }
              } catch (_) {}
              this.activePointers.set(e.pointerId, {
                key: p.key,
                startTime: performance.now()
              });
              this._recomputeState();
            });

            p.el.addEventListener('pointermove', (e) => {
              const existing = this.activePointers.get(e.pointerId);
              if (!existing) return;
              if (this.mode === 'local') {
                // Allow thumb slide between paired buttons in 2P same-device mode
                const hoveredKey = this._padKeyAtPoint(e.clientX, e.clientY);
                if (hoveredKey && hoveredKey !== existing.key) {
                  this.activePointers.set(e.pointerId, {
                    key: hoveredKey,
                    startTime: performance.now()
                  });
                  this._recomputeState();
                }
              }
            });

            const releasePointer = (e) => {
              if (this.activePointers.delete(e.pointerId)) {
                this._recomputeState();
              }
            };
            p.el.addEventListener('pointerup', releasePointer);
            p.el.addEventListener('pointercancel', releasePointer);
            p.el.addEventListener('lostpointercapture', releasePointer);
          }

          window.addEventListener('pointerup', (e) => {
            if (this.activePointers.delete(e.pointerId)) {
              this._recomputeState();
            }
          });
          window.addEventListener('pointercancel', (e) => {
            if (this.activePointers.delete(e.pointerId)) {
              this._recomputeState();
            }
          });
        }

        _syncVisuals() {
          this.dom.p1L.classList.toggle('pressed', this.state.p1_l);
          this.dom.p1R.classList.toggle('pressed', this.state.p1_r);
          this.dom.p2L.classList.toggle('pressed', this.state.p2_l);
          this.dom.p2R.classList.toggle('pressed', this.state.p2_r);
        }

        setSingleLayout(layout) {
          this.singleLayout = layout === 'grouped' ? 'grouped' : 'split';
          localStorage.setItem('crashahead_1p_layout', this.singleLayout);
          this._applyLayout();
          return this.singleLayout;
        }

        setMode(mode) {
          this.mode = mode;
          this._clearAllInputs();
          this._applyLayout();
        }

        _applyLayout() {
          const { root, groupP1, groupP2, p1L, p1R, p2L, p2R } = this.dom;
          root.classList.remove('mode-1p-split', 'mode-2p');
          p1L.classList.remove('pad-left-btn');
          p1R.classList.remove('pad-right-btn');
          p2L.classList.remove('pad-left-btn');
          p2R.classList.remove('pad-right-btn');

          if (this.mode === 'menu') {
            root.classList.add('hidden');
            return;
          }
          root.classList.remove('hidden');

          if (this.mode === 'local') {
            root.classList.add('mode-2p');
            groupP1.classList.remove('hidden');
            groupP2.classList.remove('hidden');
          } else if (this.mode === 'online_client') {
            groupP1.classList.add('hidden');
            groupP2.classList.remove('hidden');
            if (this.singleLayout === 'split') {
              root.classList.add('mode-1p-split');
              p2L.classList.add('pad-left-btn');
              p2R.classList.add('pad-right-btn');
            }
          } else {
            groupP1.classList.remove('hidden');
            groupP2.classList.add('hidden');
            if (this.singleLayout === 'split') {
              root.classList.add('mode-1p-split');
              p1L.classList.add('pad-left-btn');
              p1R.classList.add('pad-right-btn');
            }
          }
        }

        _getHoldMsFor(key, now) {
          if (!this.state[key] || !this.pressTimes[key]) return 0;
          return Math.max(0, Math.round(now - this.pressTimes[key]));
        }

        getP1() {
          const now = performance.now();
          if (this.mode === 'ai' || this.mode === 'online_host') {
            const l = this.state.p1_l || this.state.p2_l;
            const r = this.state.p1_r || this.state.p2_r;
            const lHoldMs = Math.max(this._getHoldMsFor('p1_l', now), this._getHoldMsFor('p2_l', now));
            const rHoldMs = Math.max(this._getHoldMsFor('p1_r', now), this._getHoldMsFor('p2_r', now));
            return { l, r, lHoldMs, rHoldMs, holdMs: r && !l ? rHoldMs : l && !r ? lHoldMs : 0 };
          }
          const l = this.state.p1_l;
          const r = this.state.p1_r;
          const lHoldMs = this._getHoldMsFor('p1_l', now);
          const rHoldMs = this._getHoldMsFor('p1_r', now);
          return { l, r, lHoldMs, rHoldMs, holdMs: r && !l ? rHoldMs : l && !r ? lHoldMs : 0 };
        }

        getP2() {
          const now = performance.now();
          if (this.mode === 'online_client') {
            const l = this.state.p1_l || this.state.p2_l;
            const r = this.state.p1_r || this.state.p2_r;
            const lHoldMs = Math.max(this._getHoldMsFor('p1_l', now), this._getHoldMsFor('p2_l', now));
            const rHoldMs = Math.max(this._getHoldMsFor('p1_r', now), this._getHoldMsFor('p2_r', now));
            return { l, r, lHoldMs, rHoldMs, holdMs: l && !r ? lHoldMs : r && !l ? rHoldMs : 0 };
          }
          const l = this.state.p2_l;
          const r = this.state.p2_r;
          const lHoldMs = this._getHoldMsFor('p2_l', now);
          const rHoldMs = this._getHoldMsFor('p2_r', now);
          return { l, r, lHoldMs, rHoldMs, holdMs: l && !r ? lHoldMs : r && !l ? rHoldMs : 0 };
        }
      }

      // =========================================================================
      // 8. PEERJS P2P NETWORK MANAGER (PREDICTION + RIGID-BODY RECONCILIATION)
      // =========================================================================
      function generateRoomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const bytes = new Uint8Array(4);
        crypto.getRandomValues(bytes);
        let code = '';
        for (let i = 0; i < 4; i++) code += chars[bytes[i] % chars.length];
        return `CRSH-${code}`;
      }

      class NetworkManager {
        constructor(callbacks) {
          this.cb = callbacks;
          this.peer = null;
          this.conn = null;
          this.role = null;
          this.roomCode = '';
          this.pingMs = 0;
          this.pingTimer = null;
          this.reliableTimer = null;
          this.dialTimer = null;

          this.remoteInput = { seq: 0, l: false, r: false, holdMs: 0 };
          this.lastHostP1Input = { l: false, r: false, holdMs: 0 };
          this.inputSeq = 0;
          this.inputSendTick = 0;
          this.lastInputSent = { l: false, r: false };
          this.pendingInputs = [];
          this.pendingSnapshot = null;
          this.lastSeq = 0;

          this.nextEvtId = 0;
          this.pendingReliable = new Map();
          this.seenEids = new Set();
        }

        resetPredictionState() {
          this.remoteInput = { seq: 0, l: false, r: false, holdMs: 0 };
          this.lastHostP1Input = { l: false, r: false, holdMs: 0 };
          this.inputSeq = 0;
          this.inputSendTick = 0;
          this.lastInputSent = { l: false, r: false };
          this.pendingInputs = [];
          this.pendingSnapshot = null;
          this.lastSeq = 0;
        }

        destroy() {
          if (this.pingTimer) { clearInterval(this.pingTimer); this.pingTimer = null; }
          if (this.reliableTimer) { clearInterval(this.reliableTimer); this.reliableTimer = null; }
          if (this.dialTimer) { clearTimeout(this.dialTimer); this.dialTimer = null; }
          const oldConn = this.conn;
          this.conn = null;
          if (oldConn) { try { oldConn.close(); } catch (_) {} }
          if (this.peer) { try { this.peer.destroy(); } catch (_) {} this.peer = null; }
          this.role = null;
          this.pendingReliable.clear();
          this.seenEids.clear();
          this.resetPredictionState();
        }

        _initPeer(peerId, onReady) {
          const prevRole = this.role;
          const prevCode = this.roomCode;
          this.destroy();
          this.role = prevRole;
          this.roomCode = prevCode;
          if (typeof Peer === 'undefined') {
            this.cb.onStatus('PeerJS CDN failed to load.', 'error', true);
            return;
          }
          const opts = {
            debug: 0,
            config: {
              iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                { urls: 'stun:openrelay.metered.ca:80' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
              ]
            }
          };
          this.peer = peerId ? new Peer(peerId, opts) : new Peer(opts);
          this.peer.on('open', (id) => onReady(id));
          this.peer.on('disconnected', () => {
            if (this.peer && !this.peer.destroyed && !this.conn) {
              try { this.peer.reconnect(); } catch (_) {}
            }
          });
          this.peer.on('error', (err) => {
            if (err && err.type === 'unavailable-id' && this.role === 'host') {
              this.hostRoom();
              return;
            }
            if (this.dialTimer) { clearTimeout(this.dialTimer); this.dialTimer = null; }
            const msg = (err && err.type === 'peer-unavailable')
              ? 'Room not found or Host disconnected.'
              : `Connection error: ${(err && (err.type || err.message)) || 'unknown'}`;
            this.cb.onStatus(msg, 'error', true);
          });
        }

        hostRoom() {
          this.role = 'host';
          this.roomCode = generateRoomCode();
          this.cb.onRoomCode(this.roomCode);
          this.cb.onStatus('Opening room...', 'neutral', false);
          this._initPeer(PEER_PREFIX + this.roomCode, () => {
            this.role = 'host';
            this.cb.onStatus(`Hosting ${this.roomCode} — waiting for player`, 'neutral', false);
            this.peer.on('connection', (conn) => {
              if (this.conn && this.conn.open) { conn.close(); return; }
              this._attachConnection(conn);
            });
          });
        }

        joinRoom(codeInput) {
          let raw = (codeInput || '').trim();
          if (raw.includes('room=')) {
            try { raw = new URL(raw).searchParams.get('room') || raw; } catch (_) {}
          }
          const clean = raw.toUpperCase();
          if (!clean) {
            this.cb.onStatus('Enter a room code first.', 'error', false);
            return;
          }
          const normalized = clean.startsWith('CRSH-') ? clean : `CRSH-${clean}`;
          this.roomCode = normalized;
          this.role = 'client';
          this.cb.onStatus(`Connecting to ${normalized}...`, 'neutral', false);
          this._initPeer(null, () => {
            this.role = 'client';
            const conn = this.peer.connect(PEER_PREFIX + normalized, { serialization: 'json', reliable: false });
            this._attachConnection(conn);
            if (this.dialTimer) clearTimeout(this.dialTimer);
            this.dialTimer = setTimeout(() => {
              if (!this.conn || !this.conn.open) {
                this.cb.onStatus('Connection timed out. Tap Retry or check code.', 'error', true);
              }
            }, 12000);
          });
        }

        _attachConnection(conn) {
          this.conn = conn;
          conn.on('open', () => {
            if (this.conn !== conn) return;
            if (this.dialTimer) { clearTimeout(this.dialTimer); this.dialTimer = null; }
            this.cb.onStatus('Connected!', 'connected', false);
            this.cb.onConnected(this.role);
            this._startTimers();
          });
          conn.on('iceStateChanged', (state) => {
            if (this.conn !== conn) return;
            if (state === 'failed' && !conn.open) {
              if (this.dialTimer) { clearTimeout(this.dialTimer); this.dialTimer = null; }
              this.cb.onStatus('WebRTC connection failed. Tap Retry.', 'error', true);
            }
          });
          conn.on('data', (msg) => {
            if (this.conn !== conn) return;
            this._handleMessage(msg);
          });
          conn.on('close', () => {
            if (this.conn !== conn) return;
            this.destroy();
            this.cb.onDisconnected('Opponent disconnected.');
          });
          conn.on('error', () => {
            if (this.conn !== conn) return;
            this.destroy();
            this.cb.onDisconnected('Peer connection lost.');
          });
        }

        _startTimers() {
          if (this.pingTimer) clearInterval(this.pingTimer);
          this.pingTimer = setInterval(() => {
            if (this.conn && this.conn.open) this.conn.send({ t: 'ping', ts: performance.now() });
          }, 1500);

          if (this.reliableTimer) clearInterval(this.reliableTimer);
          this.reliableTimer = setInterval(() => {
            if (!this.conn || !this.conn.open || this.pendingReliable.size === 0) return;
            const now = performance.now();
            for (const [eid, entry] of this.pendingReliable.entries()) {
              if (entry.attempts >= 30) {
                this.pendingReliable.delete(eid);
                continue;
              }
              if (now - entry.lastSent >= 110) {
                entry.lastSent = now;
                entry.attempts += 1;
                this.conn.send(entry.msg);
              }
            }
          }, 120);
        }

        sendReliable(type, payload = {}) {
          if (!this.conn || !this.conn.open) return;
          const eid = ++this.nextEvtId;
          const msg = { t: type, _eid: eid, ...payload };
          this.pendingReliable.set(eid, { msg, lastSent: performance.now(), attempts: 1 });
          this.conn.send(msg);
        }

        _handleMessage(msg) {
          if (!msg || typeof msg !== 'object') return;
          if (typeof msg._eid === 'number') {
            if (this.conn && this.conn.open) this.conn.send({ t: 'ack', eid: msg._eid });
            if (this.seenEids.has(msg._eid)) return;
            this.seenEids.add(msg._eid);
            if (this.seenEids.size > 64) {
              const first = this.seenEids.values().next().value;
              this.seenEids.delete(first);
            }
          }

          switch (msg.t) {
            case 'ack':
              this.pendingReliable.delete(msg.eid);
              break;
            case 'ping':
              if (this.conn && this.conn.open) this.conn.send({ t: 'pong', ts: msg.ts });
              break;
            case 'pong':
              this.pingMs = Math.max(1, Math.round(performance.now() - msg.ts));
              this.cb.onPing(this.pingMs);
              break;
            case 'input': {
              const seq = msg.seq || 0;
              if (seq >= this.remoteInput.seq || seq === 0) {
                this.remoteInput = { seq, l: !!msg.l, r: !!msg.r, holdMs: msg.holdMs || 0 };
              }
              break;
            }
            case 'match_start':
              this.resetPredictionState();
              this.cb.onMatchStart(msg.ai || 0);
              break;
            case 'snap':
              if (msg.sq <= this.lastSeq) return;
              this.lastSeq = msg.sq;
              this.pendingSnapshot = msg;
              break;
            case 'evt':
              if (msg.kind === 'rematch_start') this.resetPredictionState();
              this.cb.onGameEvent(msg);
              break;
            case 'rematch':
              this.cb.onRematchSignal();
              break;
          }
        }

        queueClientInput(inp) {
          const seq = ++this.inputSeq;
          const l = !!(inp && inp.l);
          const r = !!(inp && inp.r);
          const holdMs = (inp && inp.holdMs) || 0;
          const cmd = { seq, l, r, holdMs };
          this.pendingInputs.push(cmd);
          if (this.pendingInputs.length > 90) this.pendingInputs.shift();

          if (this.conn && this.conn.open) {
            this.inputSendTick++;
            const changed = l !== this.lastInputSent.l || r !== this.lastInputSent.r;
            if (changed || l || r || this.inputSendTick % 4 === 0) {
              this.lastInputSent = { l, r };
              this.conn.send({ t: 'input', seq, l, r, holdMs });
            }
          }
          return cmd;
        }

        sendMatchStart(arenaIndex) {
          this.resetPredictionState();
          this.sendReliable('match_start', { ai: arenaIndex });
        }

        sendEvent(kind, data = {}) {
          this.sendReliable('evt', { kind, ...data });
        }

        sendRematch() {
          this.sendReliable('rematch', {});
        }

        buildHostSnapshot(sim, meta) {
          this.lastSeq++;
          const pack = (b) => ({
            x: Math.round(b.position.x * 10) / 10,
            y: Math.round(b.position.y * 10) / 10,
            vx: Math.round(b.velocity.x * 100) / 100,
            vy: Math.round(b.velocity.y * 100) / 100,
            a: Math.round(b.angle * 1000) / 1000,
            av: Math.round(b.angularVelocity * 1000) / 1000
          });
          const payload = {
            t: 'snap',
            sq: this.lastSeq,
            ak: this.remoteInput.seq,
            ai: sim.arenaIndex,
            sc: [meta.scores[0], meta.scores[1]],
            rn: meta.roundNumber,
            ph: meta.phase,
            bt: meta.bannerText,
            i1: meta.p1Input ? { l: !!meta.p1Input.l, r: !!meta.p1Input.r, holdMs: meta.p1Input.holdMs || 0 } : { l: false, r: false, holdMs: 0 },
            d1: sim.p1Car.dead ? 1 : 0,
            d2: sim.p2Car.dead ? 1 : 0,
            dr1: sim.p1Car.driving ? 1 : 0,
            dr2: sim.p2Car.driving ? 1 : 0,
            hm1: Math.round(sim.p1Car.accelHoldMs || 0),
            hm2: Math.round(sim.p2Car.accelHoldMs || 0),
            ad1: sim.p1Car.accelDir || 0,
            ad2: sim.p2Car.accelDir || 0,
            sw: sim.seesaws.map((s) => ({
              a: Math.round(s.body.angle * 1000) / 1000,
              av: Math.round(s.body.angularVelocity * 1000) / 1000
            }))
          };
          for (const [carKey, bodyKey, shortKey] of BODY_KEYS) {
            payload[shortKey] = pack(sim[carKey][bodyKey]);
          }
          return payload;
        }

        sendHostSnapshot(sim, meta) {
          if (!this.conn || !this.conn.open) return;
          this.conn.send(this.buildHostSnapshot(sim, meta));
        }

        reconcileClientFrame(sim, onSnapshotMeta) {
          const snap = this.pendingSnapshot;
          if (!snap) return false;
          this.pendingSnapshot = null;

          if (onSnapshotMeta) onSnapshotMeta(snap);

          const ackSeq = snap.ak || 0;
          if (this.pendingInputs.length > 0) {
            this.pendingInputs = this.pendingInputs.filter((cmd) => cmd.seq > ackSeq);
          }
          this.lastHostP1Input = snap.i1 || { l: false, r: false, holdMs: 0 };

          const beforeP1 = sim.captureCarPose(sim.p1Car);
          const beforeP2 = sim.captureCarPose(sim.p2Car);

          // Step 1: Snap rigid bodies to authoritative host snapshot
          sim.applyNetState(snap);

          // Step 2: Replay unacknowledged local client inputs for Server Reconciliation
          if (snap.ph === 'FIGHT' && this.pendingInputs.length > 0) {
            const maxReplay = Math.min(this.pendingInputs.length, 24);
            const startIdx = this.pendingInputs.length - maxReplay;
            for (let i = startIdx; i < this.pendingInputs.length; i++) {
              sim.step(this.lastHostP1Input, this.pendingInputs[i], true);
            }
          }

          // Step 3: Smooth micro-divergence on predicted P2 & interpolated remote P1
          if (beforeP2 && sim.p2Car) {
            const dx = sim.p2Car.chassis.position.x - beforeP2.c.x;
            const dy = sim.p2Car.chassis.position.y - beforeP2.c.y;
            const errDist = Math.hypot(dx, dy);
            if (errDist > 0.05 && errDist < 24) {
              sim.blendCarPose(sim.p2Car, beforeP2, 0.35);
            }
          }
          if (beforeP1 && sim.p1Car) {
            const dx1 = sim.p1Car.chassis.position.x - beforeP1.c.x;
            const dy1 = sim.p1Car.chassis.position.y - beforeP1.c.y;
            if (Math.hypot(dx1, dy1) < 28) {
              sim.blendCarPose(sim.p1Car, beforeP1, 0.45);
            }
          }
          return true;
        }
      }

      // =========================================================================
      // 9. GAME ORCHESTRATOR
      // =========================================================================
      class CrashAheadGame {
        constructor() {
          this.sound = new SoundFX();
          this.canvas = document.getElementById('game-canvas');
          this.renderer = new CanvasRenderer(this.canvas);
          this.input = new InputManager(this.sound);
          this.ai = new SmartAI();
          this.sim = new PhysicsSimulation(true);

          this.mode = 'attract'; // 'attract' | 'ai' | 'local' | 'online_host' | 'online_client'
          this.phase = 'MENU';   // 'MENU' | 'FIGHT' | 'KO' | 'MATCH_OVER'
          this.scores = [0, 0];
          this.roundNumber = 1;
          this.bannerText = '';
          this.selectedArenaIdx = -1; // -1 = ALL 9 MAPS (IN ORDER), 0..8 = locked specific map
          this.attractMapTicks = 0;

          this.koPending = false;
          this.koWindowMs = 0;
          this.koTimerMs = 0;
          this.koPendingRound = 0;
          this._pendingAward = 0;

          this.p1Input = { l: false, r: false };
          this.p2Input = { l: false, r: false };
          this.localRematchWant = false;
          this.remoteRematchWant = false;

          this._cacheDOM();
          this._bindSimCallbacks();
          this._initNetwork();
          this._bindUI();

          window.addEventListener('resize', () => this.renderer.resize());
          window.addEventListener('orientationchange', () => setTimeout(() => this.renderer.resize(), 120));

          this._startAttractMode();
          this._checkUrlAutoJoin();
          this._startMainLoop();
        }

        _cacheDOM() {
          this.dom = {
            scorePill: document.getElementById('score-pill'),
            scoreP1: document.getElementById('score-p1'),
            scoreP2: document.getElementById('score-p2'),
            pingTag: document.getElementById('online-ping-tag'),
            btnExit: document.getElementById('btn-exit'),

            menuOverlay: document.getElementById('menu-overlay'),
            onlineOverlay: document.getElementById('online-overlay'),
            victoryOverlay: document.getElementById('victory-overlay'),

            mapTitle: document.getElementById('map-picker-title'),
            mapSub: document.getElementById('map-picker-sub'),
            btnCtrlToggle: document.getElementById('btn-ctrl-toggle'),
            btnMute: document.getElementById('btn-mute'),
            iconSoundOn: document.getElementById('icon-sound-on'),
            iconSoundOff: document.getElementById('icon-sound-off'),

            tabHost: document.getElementById('tab-host'),
            tabJoin: document.getElementById('tab-join'),
            panelHost: document.getElementById('panel-host'),
            panelJoin: document.getElementById('panel-join'),
            hostRoomCode: document.getElementById('host-room-code'),
            joinCodeInput: document.getElementById('join-code-input'),
            onlineStatus: document.getElementById('online-status'),
            onlineStatusText: document.getElementById('online-status-text'),
            onlineLobbyPing: document.getElementById('online-lobby-ping'),
            btnOnlineRetry: document.getElementById('btn-online-retry'),
            btnOnlineStart: document.getElementById('btn-online-start'),

            victoryTitle: document.getElementById('victory-title'),
            victoryScore: document.getElementById('victory-score'),
            victoryNote: document.getElementById('victory-note'),
            btnRematch: document.getElementById('btn-rematch')
          };
        }

        _pickArenaIndex(previousIndex = -1) {
          if (this.selectedArenaIdx >= 0) return clamp(this.selectedArenaIdx, 0, ARENAS.length - 1);
          if (previousIndex < 0) return 0;
          return (previousIndex + 1) % ARENAS.length;
        }

        _updateMapPickerUI() {
          if (this.selectedArenaIdx < 0) {
            this.dom.mapTitle.textContent = 'ALL 9 MAPS (IN ORDER)';
            this.dom.mapSub.textContent = 'Plays Maps 1–9 in exact order • Tap < > to pick Map 1–9';
          } else {
            const a = ARENAS[this.selectedArenaIdx];
            this.dom.mapTitle.textContent = `MAP ${a.id}/9: ${a.name}`;
            this.dom.mapSub.textContent = a.desc;
          }
        }

        _bindSimCallbacks() {
          const handleRoundKO = (loserIdx, pt, isWater) => {
            if (this.mode === 'attract') {
              if (!this.koPending) {
                this.koPending = true;
                if (!isWater) this.sim.popHelmet(loserIdx, pt);
                else {
                  const c = loserIdx === 1 ? this.sim.p1Car : this.sim.p2Car;
                  if (c) c.dead = true;
                }
                this.koTimerMs = 900;
              }
              return;
            }
            if (this.phase !== 'FIGHT') return;

            if (!isWater) {
              this.sim.popHelmet(loserIdx, pt);
              this.renderer.spawnBonkPop(pt.x, pt.y, loserIdx === 1 ? PALETTE.red.body : PALETTE.blue.body);
              this.sound.playBonk();
              if (this.mode === 'online_host') {
                this.net.sendEvent('bonk', { x: Math.round(pt.x), y: Math.round(pt.y), p: loserIdx });
              }
            } else {
              const c = loserIdx === 1 ? this.sim.p1Car : this.sim.p2Car;
              if (c) c.dead = true;
              this.renderer.spawnWaterSplash(pt.x);
              this.sound.playSplash();
              if (this.mode === 'online_host') {
                this.net.sendEvent('splash', { x: Math.round(pt.x) });
              }
            }

            Haptics.ko();

            if (!this.koPending) {
              this.koPending = true;
              this.koWindowMs = DOUBLE_KO_WINDOW_MS;
              this._pendingAward = loserIdx === 1 ? 2 : 1;
            } else if (this._pendingAward !== 0 && this._pendingAward !== (loserIdx === 1 ? 2 : 1)) {
              this._pendingAward = 0; // Double KO within 100ms
            }
          };

          this.sim.onHeadKO = (loserIdx, pt) => handleRoundKO(loserIdx, pt, false);
          this.sim.onWaterKO = (loserIdx, pt) => handleRoundKO(loserIdx, pt, true);
          this.sim.onCarBump = (_pt, norm) => {
            if (this.mode === 'attract') return;
            this.sound.playBump(norm);
            if (norm > 0.4) Haptics.bump();
            if (this.mode === 'online_host') this.net.sendEvent('bump', { n: Math.round(norm * 100) / 100 });
          };
        }

        _initNetwork() {
          const applySnapshotMeta = (snap) => {
            if (this.mode !== 'online_client') return;
            if (snap.rn !== this.roundNumber || snap.ai !== this.sim.arenaIndex) {
              this.roundNumber = snap.rn;
              this.koPendingRound = 0;
              this.net.pendingInputs = [];
              this.sim.resetArena(snap.ai || 0);
              this.renderer.clearEffects();
            }
            if (snap.sc[0] !== this.scores[0] || snap.sc[1] !== this.scores[1]) {
              this.scores = [snap.sc[0], snap.sc[1]];
              this._updateScoreUI();
            }
            const staleFight = this.koPendingRound === snap.rn && snap.ph === 'FIGHT';
            if (!staleFight) this.phase = snap.ph;
            if (snap.ph === 'KO') this.koPendingRound = snap.rn;
            this.bannerText = snap.bt || '';
            if (this.sim.p1Car) this.sim.p1Car.dead = !!snap.d1;
            if (this.sim.p2Car) this.sim.p2Car.dead = !!snap.d2;
          };
          this._applySnapshotMeta = applySnapshotMeta;

          this.net = new NetworkManager({
            onRoomCode: (code) => { this.dom.hostRoomCode.textContent = code; },
            onStatus: (text, cls, showRetry = false) => {
              this.dom.onlineStatusText.textContent = text;
              this.dom.onlineStatus.className = `status-pill ${cls}`;
              this.dom.btnOnlineRetry.classList.toggle('hidden', !showRetry);
            },
            onConnected: (role) => {
              this.dom.onlineStatusText.textContent = role === 'host' ? 'Player 2 Connected!' : 'Connected to Host!';
              this.dom.onlineStatus.className = 'status-pill connected';
              this.dom.btnOnlineRetry.classList.add('hidden');
              this.dom.btnOnlineStart.disabled = role !== 'host';
              this.dom.btnOnlineStart.textContent = role === 'host' ? 'START MATCH!' : 'WAITING FOR HOST...';
            },
            onPing: (ms) => {
              this.dom.onlineLobbyPing.textContent = `${ms}ms`;
              this.dom.pingTag.textContent = `${ms}ms`;
            },
            onMatchStart: (arenaIdx) => {
              this.startMatch('online_client', arenaIdx);
            },
            onSnapshotState: applySnapshotMeta,
            onGameEvent: (msg) => {
              if (msg.kind === 'bump') {
                this.sound.playBump(msg.n || 0.5);
                if (msg.n > 0.4) Haptics.bump();
              } else if (msg.kind === 'bonk') {
                this.koPendingRound = this.roundNumber;
                this.phase = 'KO';
                this.bannerText = 'BONK!';
                this.renderer.spawnBonkPop(msg.x, msg.y, msg.p === 1 ? PALETTE.red.body : PALETTE.blue.body);
                this.sound.playBonk();
                Haptics.ko();
              } else if (msg.kind === 'splash') {
                this.koPendingRound = this.roundNumber;
                this.phase = 'KO';
                this.bannerText = 'SPLASH!';
                this.renderer.spawnWaterSplash(msg.x);
                this.sound.playSplash();
                Haptics.ko();
              } else if (msg.kind === 'match_over') {
                this.scores = msg.scores;
                this._updateScoreUI();
                this._showVictory();
              } else if (msg.kind === 'rematch_start') {
                this.startMatch('online_client', msg.ai || 0);
              }
            },
            onRematchSignal: () => {
              this.remoteRematchWant = true;
              if (this.mode === 'online_host') {
                if (this.localRematchWant) this._triggerOnlineRematch();
                else this.dom.victoryNote.textContent = 'Opponent wants a rematch!';
              } else {
                this.dom.victoryNote.textContent = 'Host wants a rematch!';
              }
            },
            onDisconnected: (reason) => {
              this.mode = 'attract';
              this.phase = 'MENU';
              this.input.setMode('menu');
              this.sound.updateEngine(false, 0, 0);
              this.dom.scorePill.classList.add('hidden');
              this.dom.btnExit.classList.add('hidden');
              this.dom.victoryOverlay.classList.add('hidden');
              this.dom.onlineOverlay.classList.remove('hidden');
              this.dom.onlineStatusText.textContent = reason;
              this.dom.onlineStatus.className = 'status-pill error';
              this.dom.btnOnlineRetry.classList.remove('hidden');
              this.dom.btnOnlineStart.disabled = true;
              this.dom.btnOnlineStart.textContent = 'WAITING FOR OPPONENT...';
            }
          });
        }

        _bindUI() {
          document.getElementById('force-landscape-btn').addEventListener('click', () => {
            document.body.classList.add('force-landscape');
            setTimeout(() => this.renderer.resize(), 60);
          });

          this.dom.btnMute.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.setMuted(!this.sound.muted);
            this._updateSoundUI();
            this.sound.playClick();
          });
          this._updateSoundUI();

          document.getElementById('btn-fullscreen').addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            const docEl = document.documentElement;
            if (!document.fullscreenElement) {
              if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
              document.exitFullscreen().catch(() => {});
            }
          });

          // Map Selector Pill cycling (-1 = In-Order Sequence 1..9, 0..8 = Specific Map 1..9)
          const stepMap = (delta) => {
            this.sound.unlock();
            this.sound.playClick();
            const total = ARENAS.length + 1; // -1, 0 .. 8
            const cur = this.selectedArenaIdx + 1;
            const next = ((cur + delta) % total + total) % total;
            this.selectedArenaIdx = next - 1;
            this._updateMapPickerUI();
            if (this.mode === 'attract') {
              const previewIdx = this.selectedArenaIdx >= 0 ? this.selectedArenaIdx : 0;
              this.sim.resetArena(previewIdx);
              this.renderer.clearEffects();
            }
          };
          document.getElementById('btn-map-prev').addEventListener('click', () => stepMap(-1));
          document.getElementById('btn-map-next').addEventListener('click', () => stepMap(1));
          document.getElementById('btn-map-cycle').addEventListener('click', () => stepMap(1));
          this._updateMapPickerUI();

          const syncCtrlLabel = () => {
            this.dom.btnCtrlToggle.textContent =
              this.input.singleLayout === 'split' ? '1P TOUCH: SPLIT THUMBS' : '1P TOUCH: SIDE PAIR';
          };
          syncCtrlLabel();
          this.dom.btnCtrlToggle.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            this.input.setSingleLayout(this.input.singleLayout === 'split' ? 'grouped' : 'split');
            syncCtrlLabel();
          });

          document.getElementById('btn-mode-local').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick(); this.startMatch('local');
          });
          document.getElementById('btn-mode-ai').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick(); this.startMatch('ai');
          });
          document.getElementById('btn-mode-online').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick(); this._openOnlineModal('host');
          });

          document.getElementById('btn-online-back').addEventListener('click', () => {
            this.sound.playClick();
            this.net.destroy();
            this.dom.onlineOverlay.classList.add('hidden');
            this.dom.menuOverlay.classList.remove('hidden');
          });

          this.dom.tabHost.addEventListener('click', () => { this.sound.playClick(); this._switchOnlineTab('host'); });
          this.dom.tabJoin.addEventListener('click', () => { this.sound.playClick(); this._switchOnlineTab('join'); });

          document.getElementById('btn-copy-code').addEventListener('click', (e) => {
            this.sound.playClick();
            this._copyWithFeedback(this.dom.hostRoomCode.textContent, e.currentTarget, 'COPY CODE');
          });
          document.getElementById('btn-copy-link').addEventListener('click', (e) => {
            this.sound.playClick();
            const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(this.dom.hostRoomCode.textContent)}`;
            this._copyWithFeedback(url, e.currentTarget, 'COPY LINK');
          });

          document.getElementById('btn-join-connect').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick();
            this.net.joinRoom(this.dom.joinCodeInput.value);
          });
          this.dom.joinCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-join-connect').click();
          });

          this.dom.btnOnlineStart.addEventListener('click', () => {
            if (this.net.role !== 'host') return;
            this.sound.unlock();
            this.sound.playClick();
            const arenaIdx = this._pickArenaIndex(-1);
            this.net.sendMatchStart(arenaIdx);
            this.startMatch('online_host', arenaIdx);
          });

          this.dom.btnOnlineRetry.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            this.dom.btnOnlineRetry.classList.add('hidden');
            if (this.net.role === 'client') {
              this.net.joinRoom(this.dom.joinCodeInput.value || this.net.roomCode);
            } else {
              this.net.hostRoom();
            }
          });

          this.dom.btnExit.addEventListener('click', () => {
            this.sound.playClick();
            this.net.destroy();
            this._startAttractMode();
          });

          this.dom.btnRematch.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            if (this.mode === 'online_host' || this.mode === 'online_client') {
              this.localRematchWant = true;
              this.net.sendRematch();
              this.dom.btnRematch.disabled = true;
              this.dom.btnRematch.textContent = 'WAITING...';
              if (this.mode === 'online_host' && this.remoteRematchWant) this._triggerOnlineRematch();
            } else {
              this.dom.victoryOverlay.classList.add('hidden');
              this.startMatch(this.mode);
            }
          });

          document.getElementById('btn-victory-menu').addEventListener('click', () => {
            this.sound.playClick();
            this.net.destroy();
            this._startAttractMode();
          });
        }

        _copyWithFeedback(text, btn, originalText) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              btn.textContent = 'COPIED!';
              setTimeout(() => { btn.textContent = originalText; }, 1200);
            }).catch(() => {});
          }
        }

        _updateSoundUI() {
          this.dom.iconSoundOn.classList.toggle('hidden', this.sound.muted);
          this.dom.iconSoundOff.classList.toggle('hidden', !this.sound.muted);
        }

        _openOnlineModal(tab) {
          this.dom.menuOverlay.classList.add('hidden');
          this.dom.onlineOverlay.classList.remove('hidden');
          this._switchOnlineTab(tab);
        }

        _switchOnlineTab(tab) {
          this.dom.tabHost.classList.toggle('active', tab === 'host');
          this.dom.tabJoin.classList.toggle('active', tab === 'join');
          this.dom.panelHost.classList.toggle('hidden', tab !== 'host');
          this.dom.panelJoin.classList.toggle('hidden', tab !== 'join');
          this.dom.btnOnlineStart.disabled = true;
          this.dom.btnOnlineStart.textContent = tab === 'host' ? 'WAITING FOR OPPONENT...' : 'WAITING FOR HOST...';
          this.dom.onlineLobbyPing.textContent = '';

          if (tab === 'host') {
            this.dom.btnOnlineRetry.classList.add('hidden');
            this.net.hostRoom();
          } else {
            this.dom.btnOnlineRetry.classList.add('hidden');
            this.net.destroy();
            this.dom.onlineStatusText.textContent = 'Enter friend room code to join.';
            this.dom.onlineStatus.className = 'status-pill';
            setTimeout(() => this.dom.joinCodeInput.focus(), 80);
          }
        }

        _checkUrlAutoJoin() {
          const room = new URLSearchParams(window.location.search).get('room');
          if (!room) return;
          this._openOnlineModal('join');
          this.dom.joinCodeInput.value = room.toUpperCase();
          setTimeout(() => this.net.joinRoom(room), 300);
        }

        _startAttractMode() {
          this.mode = 'attract';
          this.phase = 'MENU';
          this.scores = [0, 0];
          this.bannerText = '';
          this.koPending = false;
          this.input.setMode('menu');
          this.sound.updateEngine(false, 0, 0);

          this.dom.scorePill.classList.add('hidden');
          this.dom.btnExit.classList.add('hidden');
          this.dom.pingTag.classList.add('hidden');
          this.dom.victoryOverlay.classList.add('hidden');
          this.dom.onlineOverlay.classList.add('hidden');
          this.dom.menuOverlay.classList.remove('hidden');

          this.sim.isHostSide = true;
          const previewIdx = this.selectedArenaIdx >= 0 ? this.selectedArenaIdx : 0;
          this.sim.resetArena(previewIdx);
          this.renderer.clearEffects();
        }

        startMatch(mode, explicitArenaIdx = null) {
          this.mode = mode;
          this.scores = [0, 0];
          this.roundNumber = 1;
          this.koPendingRound = 0;
          this.localRematchWant = false;
          this.remoteRematchWant = false;

          this.dom.menuOverlay.classList.add('hidden');
          this.dom.onlineOverlay.classList.add('hidden');
          this.dom.victoryOverlay.classList.add('hidden');
          if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
          }
          this.dom.scorePill.classList.remove('hidden');
          this.dom.btnExit.classList.remove('hidden');
          this.dom.pingTag.classList.toggle('hidden', mode !== 'online_host' && mode !== 'online_client');

          this.sim.isHostSide = mode !== 'online_client';
          this.input.setMode(mode);
          this._updateScoreUI();

          const startIdx = explicitArenaIdx !== null ? explicitArenaIdx : this._pickArenaIndex(-1);
          this._resetRound(startIdx);
        }

        _triggerOnlineRematch() {
          const arenaIdx = this._pickArenaIndex(this.sim.arenaIndex);
          this.net.sendEvent('rematch_start', { ai: arenaIdx });
          this.startMatch('online_host', arenaIdx);
        }

        _resetRound(explicitArenaIdx = null) {
          this.phase = 'FIGHT';
          this.bannerText = '';
          this.koPending = false;
          this.koWindowMs = 0;
          this.koTimerMs = 0;
          this._pendingAward = 0;
          this.p1Input = { l: false, r: false };
          this.p2Input = { l: false, r: false };

          const nextIdx = explicitArenaIdx !== null ? explicitArenaIdx : this._pickArenaIndex(this.sim.arenaIndex);
          this.sim.resetArena(nextIdx);
          this.renderer.clearEffects();
        }

        _updateScoreUI() {
          this.dom.scoreP1.textContent = String(this.scores[0]);
          this.dom.scoreP2.textContent = String(this.scores[1]);
        }

        _showVictory() {
          this.phase = 'MATCH_OVER';
          this.sound.updateEngine(false, 0, 0);
          this.sound.playVictory();
          this.input.setMode('menu');
          this.dom.victoryTitle.textContent = this.scores[0] >= WIN_SCORE ? 'RED WINS!' : 'BLUE WINS!';
          this.dom.victoryScore.textContent = `${this.scores[0]} • ${this.scores[1]}`;
          this.dom.victoryNote.textContent = '';
          this.dom.btnRematch.disabled = false;
          this.dom.btnRematch.textContent = 'PLAY AGAIN';
          this.dom.victoryOverlay.classList.remove('hidden');
        }

        _stepAttractTick() {
          if (this.koPending) {
            this.sim.step({ l: false, r: false }, { l: false, r: false }, false);
            this.koTimerMs -= FIXED_DT;
            if (this.koTimerMs <= 0) {
              this.koPending = false;
              const nextIdx = this.selectedArenaIdx >= 0
                ? this.selectedArenaIdx
                : (this.sim.arenaIndex + 1) % ARENAS.length;
              this.sim.resetArena(nextIdx);
              this.renderer.clearEffects();
            }
          } else {
            this.attractMapTicks++;
            if (this.attractMapTicks > 540 && this.selectedArenaIdx < 0) {
              this.attractMapTicks = 0;
              this.sim.resetArena((this.sim.arenaIndex + 1) % ARENAS.length);
              this.renderer.clearEffects();
            }
            this.sim.step(this.ai.decide(this.sim, true), this.ai.decide(this.sim, false), true);
          }
        }

        _stepAuthoritativeTick() {
          if (this.phase === 'MATCH_OVER') return;

          if (this.koPending && this.koWindowMs > 0) {
            this.koWindowMs -= FIXED_DT;
            if (this.koWindowMs <= 0) {
              this.phase = 'KO';
              this.koTimerMs = KO_FREEZE_MS;
              this.sim.engine.timing.timeScale = 0.25;
              this.bannerText = this._pendingAward === 0 ? 'DRAW!' : 'BONK!';
            }
          }

          if (this.phase === 'KO') {
            this.sim.step({ l: false, r: false }, { l: false, r: false }, false);
            this.koTimerMs -= FIXED_DT;
            if (this.koTimerMs <= 0) {
              if (this._pendingAward === 1) this.scores[0]++;
              else if (this._pendingAward === 2) this.scores[1]++;
              this._updateScoreUI();

              if (this.scores[0] >= WIN_SCORE || this.scores[1] >= WIN_SCORE) {
                if (this.mode === 'online_host') this.net.sendEvent('match_over', { scores: this.scores });
                this._showVictory();
                return;
              }
              this.roundNumber++;
              this._resetRound();
            }
          } else {
            this.p1Input = this.input.getP1();
            if (this.mode === 'ai') this.p2Input = this.ai.decide(this.sim, false);
            else if (this.mode === 'local') this.p2Input = this.input.getP2();
            else if (this.mode === 'online_host') this.p2Input = this.net.remoteInput;

            this.sim.step(this.p1Input, this.p2Input, true);
          }

          if (this.mode === 'online_host') {
            this.net.sendHostSnapshot(this.sim, {
              scores: this.scores,
              roundNumber: this.roundNumber,
              phase: this.phase,
              bannerText: this.bannerText,
              p1Input: this.p1Input
            });
          }
        }

        _stepClientPredictedTick() {
          if (this.phase === 'MATCH_OVER') return;
          if (this.phase !== 'FIGHT') {
            this.p2Input = { l: false, r: false, holdMs: 0 };
            this.sim.step({ l: false, r: false, holdMs: 0 }, { l: false, r: false, holdMs: 0 }, false);
            return;
          }
          // Separated input sampling -> queued for host + applied immediately for 0ms client prediction
          const rawP2 = this.input.getP2();
          this.p2Input = rawP2;
          const cmd = this.net.queueClientInput(rawP2);
          this.sim.step(this.net.lastHostP1Input, cmd, true);
        }

        _updateAudio() {
          if (this.mode === 'attract' || this.phase !== 'FIGHT') {
            this.sound.updateEngine(false, 0, 0);
            return;
          }
          const t1 = (this.p1Input.l || this.p1Input.r) ? 1 : 0;
          const t2 = (this.p2Input.l || this.p2Input.r) ? 1 : 0;
          const throttle = this.mode === 'online_client'
            ? ((this.input.state.p1_l || this.input.state.p1_r || this.input.state.p2_l || this.input.state.p2_r) ? 1 : 0)
            : Math.max(t1, t2 * 0.65);
          let spd = 0;
          if (this.sim.p1Car) spd = Math.max(spd, Math.abs(this.sim.p1Car.wheelF.angularVelocity));
          if (this.sim.p2Car) spd = Math.max(spd, Math.abs(this.sim.p2Car.wheelF.angularVelocity));
          this.sound.updateEngine(true, throttle, clamp(spd / CAR_SPEC.maxWheelSpin, 0, 1));
        }

        _startMainLoop() {
          let last = performance.now();
          let acc = 0;

          const loop = (now) => {
            const elapsed = Math.min(100, now - last);
            last = now;

            if (this.mode === 'online_client') {
              this.net.reconcileClientFrame(this.sim, this._applySnapshotMeta);
              acc += elapsed;
              while (acc >= FIXED_DT) {
                this._stepClientPredictedTick();
                acc -= FIXED_DT;
              }
            } else {
              acc += elapsed;
              while (acc >= FIXED_DT) {
                if (this.mode === 'attract') this._stepAttractTick();
                else this._stepAuthoritativeTick();
                acc -= FIXED_DT;
              }
            }

            this.renderer.updateEffects(elapsed / FIXED_DT, this.sim);
            this._updateAudio();
            this.renderer.render(this.sim, this.bannerText);
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        if (typeof Matter === 'undefined') {
          document.body.innerHTML = '<div style="padding:32px;text-align:center;"><h2>Matter.js Failed to Load</h2><p>Check your connection and refresh.</p></div>';
          return;
        }
        window.__crashAheadGame = new CrashAheadGame();
        window.__crashAheadArenas = ARENAS;
        window.__crashAheadPhysics = VEHICLE_PHYSICS;
      });
    })();
  </script>
</body>
