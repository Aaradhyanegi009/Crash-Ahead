            ctx.stroke();
            ctx.restore();
          }

          if (bannerText) {
            ctx.save();
            ctx.font = '800 54px "Fredoka", "Rubik", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 10;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = PALETTE.ink;
            ctx.strokeText(bannerText, WORLD_W * 0.5, 138);
            ctx.fillStyle = PALETTE.white;
            ctx.fillText(bannerText, WORLD_W * 0.5, 138);
            ctx.restore();
          }
        }

        render(sim, bannerText = '') {
          const ctx = this.ctx;
          ctx.save();
          ctx.scale(this.dpr, this.dpr);

          this._drawSkyAndCity(ctx);
          this._drawArenaTerrain(ctx, sim);
          if (sim.p1Car) drawRoadster(ctx, sim.p1Car, true);
          if (sim.p2Car) drawRoadster(ctx, sim.p2Car, false);
          this._drawWaterWaves(ctx, performance.now());
          this._drawEffects(ctx, bannerText);

          ctx.restore();
        }
      }

      // =========================================================================
      // 6. SMART AI OPPONENT
      // =========================================================================
      class SmartAI {
        constructor() {
          this.flipBias = 0;
          this.decisionTick = 0;
        }

        decide(sim, aiIsP1 = false) {
          const me = aiIsP1 ? sim.p1Car : sim.p2Car;
          const opp = aiIsP1 ? sim.p2Car : sim.p1Car;
          if (!me || !opp || me.dead) return { l: false, r: false };

          this.decisionTick++;
          const mx = me.chassis.position.x;
          const my = me.chassis.position.y;
          const ox = opp.chassis.position.x;
          const oy = opp.chassis.position.y;
          const angle = normalizeAngle(me.chassis.angle);
          const gx = me.playerIndex === 1 ? sim.grounded.p1R || sim.grounded.p1F : sim.grounded.p2R || sim.grounded.p2F;

          // Edge safety near water chasm
          if (mx < 220 && me.chassis.velocity.x < 0) return { l: false, r: true };
          if (mx > 1060 && me.chassis.velocity.x > 0) return { l: true, r: false };

          if (!gx && my < 480) {
            if (this.decisionTick % 24 === 0) this.flipBias = Math.random();
            if (Math.abs(angle) > 0.65) return angle > 0 ? { l: true, r: false } : { l: false, r: true };
            if (Math.abs(ox - mx) < 160 && this.flipBias < 0.55) {
              return ox < mx ? { l: true, r: false } : { l: false, r: true };
            }
            return { l: false, r: false };
          }

          if (Math.abs(angle) > 1.35) return angle > 0 ? { l: true, r: false } : { l: false, r: true };

          if (ox < mx - 35) return { l: true, r: false };
          if (ox > mx + 35) return { l: false, r: true };
          return oy < my ? { l: me.facing > 0, r: me.facing < 0 } : { l: ox < mx, r: ox >= mx };
        }
      }

      // =========================================================================
      // 7. MULTI-TOUCH & KEYBOARD INPUT MANAGER
      // =========================================================================
      class InputManager {
        constructor(sound) {
          this.sound = sound;
          this.state = { p1_l: false, p1_r: false, p2_l: false, p2_r: false };
          this.touches = new Map();
          this.singleLayout = localStorage.getItem('crashahead_1p_layout') || 'split';
          this.mode = 'menu';

          this.dom = {
            root: document.getElementById('touch-controls'),
            groupP1: document.getElementById('group-p1'),
            groupP2: document.getElementById('group-p2'),
            p1L: document.getElementById('pad-p1-l'),
            p1R: document.getElementById('pad-p1-r'),
            p2L: document.getElementById('pad-p2-l'),
            p2R: document.getElementById('pad-p2-r')
          };

          this._bindKeyboard();
          this._bindMultiTouch();
          this.setMode('menu');
        }

        _bindKeyboard() {
          window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
              if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
              e.preventDefault();
            }
            this.sound.unlock();
            if (e.code === 'KeyA') this.state.p1_l = true;
            if (e.code === 'KeyD') this.state.p1_r = true;
            if (e.code === 'ArrowLeft') this.state.p2_l = true;
            if (e.code === 'ArrowRight') this.state.p2_r = true;
            this._syncVisuals();
          });

          window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyA') this.state.p1_l = false;
            if (e.code === 'KeyD') this.state.p1_r = false;
            if (e.code === 'ArrowLeft') this.state.p2_l = false;
            if (e.code === 'ArrowRight') this.state.p2_r = false;
            this._syncVisuals();
          });
        }

        _bindMultiTouch() {
          const pads = [
            { el: this.dom.p1L, key: 'p1_l' },
            { el: this.dom.p1R, key: 'p1_r' },
            { el: this.dom.p2L, key: 'p2_l' },
            { el: this.dom.p2R, key: 'p2_r' }
          ];

          const zoneForPoint = (x, y) => {
            for (const p of pads) {
              if (p.el.offsetParent === null) continue;
              const r = p.el.getBoundingClientRect();
              if (x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8) return p.key;
            }
            return null;
          };

          const recomputeFromTouches = () => {
            const held = { p1_l: false, p1_r: false, p2_l: false, p2_r: false };
            for (const k of this.touches.values()) if (k) held[k] = true;
            Object.assign(this.state, held);
            this._syncVisuals();
          };

          const onStartOrMove = (e) => {
            if (this.mode === 'menu') return;
            this.sound.unlock();
            for (let i = 0; i < e.changedTouches.length; i++) {
              const t = e.changedTouches[i];
              this.touches.set(t.identifier, zoneForPoint(t.clientX, t.clientY));
            }
            recomputeFromTouches();
            if (e.cancelable) e.preventDefault();
          };

          const onEnd = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
              this.touches.delete(e.changedTouches[i].identifier);
            }
            recomputeFromTouches();
            if (e.cancelable && this.mode !== 'menu') e.preventDefault();
          };

          this.dom.root.addEventListener('touchstart', onStartOrMove, { passive: false });
          this.dom.root.addEventListener('touchmove', onStartOrMove, { passive: false });
          window.addEventListener('touchend', onEnd, { passive: false });
          window.addEventListener('touchcancel', onEnd, { passive: false });

          for (const p of pads) {
            p.el.addEventListener('mousedown', (e) => {
              e.preventDefault();
              this.sound.unlock();
              this.state[p.key] = true;
              this._syncVisuals();
            });
            window.addEventListener('mouseup', () => {
              if (this.state[p.key]) {
                this.state[p.key] = false;
                this._syncVisuals();
              }
            });
          }
        }

        _syncVisuals() {
          this.dom.p1L.classList.toggle('pressed', this.state.p1_l);
          this.dom.p1R.classList.toggle('pressed', this.state.p1_r);
          this.dom.p2L.classList.toggle('pressed', this.state.p2_l);
          this.dom.p2R.classList.toggle('pressed', this.state.p2_r);
        }

        setSingleLayout(layout) {
          this.singleLayout = layout === 'grouped' ? 'grouped' : 'split';
          localStorage.setItem('crashahead_1p_layout', this.singleLayout);
          this._applyLayout();
          return this.singleLayout;
        }

        setMode(mode) {
          this.mode = mode;
          this.touches.clear();
          this.state = { p1_l: false, p1_r: false, p2_l: false, p2_r: false };
          this._syncVisuals();
          this._applyLayout();
        }

        _applyLayout() {
          const { root, groupP1, groupP2, p1L, p1R, p2L, p2R } = this.dom;
          root.classList.remove('mode-1p-split');
          p1L.classList.remove('pad-left-btn');
          p1R.classList.remove('pad-right-btn');
          p2L.classList.remove('pad-left-btn');
          p2R.classList.remove('pad-right-btn');

          if (this.mode === 'menu') {
            root.classList.add('hidden');
            return;
          }
          root.classList.remove('hidden');

          if (this.mode === 'local') {
            groupP1.classList.remove('hidden');
            groupP2.classList.remove('hidden');
          } else if (this.mode === 'online_client') {
            groupP1.classList.add('hidden');
            groupP2.classList.remove('hidden');
            if (this.singleLayout === 'split') {
              root.classList.add('mode-1p-split');
              p2L.classList.add('pad-left-btn');
              p2R.classList.add('pad-right-btn');
            }
          } else {
            groupP1.classList.remove('hidden');
            groupP2.classList.add('hidden');
            if (this.singleLayout === 'split') {
              root.classList.add('mode-1p-split');
              p1L.classList.add('pad-left-btn');
              p1R.classList.add('pad-right-btn');
            }
          }
        }

        getP1() {
          if (this.mode === 'ai' || this.mode === 'online_host') {
            return { l: this.state.p1_l || this.state.p2_l, r: this.state.p1_r || this.state.p2_r };
          }
          return { l: this.state.p1_l, r: this.state.p1_r };
        }

        getP2() {
          if (this.mode === 'online_client') {
            return { l: this.state.p1_l || this.state.p2_l, r: this.state.p1_r || this.state.p2_r };
          }
          return { l: this.state.p2_l, r: this.state.p2_r };
        }
      }

      // =========================================================================
      // 8. PEERJS P2P NETWORK MANAGER (60Hz AUTHORITATIVE SYNC + INTERPOLATION)
      // =========================================================================
      const BODY_KEYS = [
        ['p1Car', 'chassis', 'c1'], ['p1Car', 'wheelR', 'w1r'], ['p1Car', 'wheelF', 'w1f'], ['p1Car', 'head', 'h1'],
        ['p2Car', 'chassis', 'c2'], ['p2Car', 'wheelR', 'w2r'], ['p2Car', 'wheelF', 'w2f'], ['p2Car', 'head', 'h2']
      ];

      function generateRoomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return `CRSH-${code}`;
      }

      class NetworkManager {
        constructor(callbacks) {
          this.cb = callbacks;
          this.peer = null;
          this.conn = null;
          this.role = null;
          this.roomCode = '';
          this.pingMs = 0;
          this.pingTimer = null;
          this.remoteInput = { l: false, r: false };
          this.lastInputSent = { l: false, r: false };
          this.snapshotBuffer = [];
          this.interpDelayMs = 50;
          this.lastSeq = 0;
        }

        destroy() {
          if (this.pingTimer) { clearInterval(this.pingTimer); this.pingTimer = null; }
          if (this.conn) { try { this.conn.close(); } catch (_) {} this.conn = null; }
          if (this.peer) { try { this.peer.destroy(); } catch (_) {} this.peer = null; }
          this.role = null;
          this.snapshotBuffer = [];
          this.remoteInput = { l: false, r: false };
        }

        _initPeer(peerId, onReady) {
          this.destroy();
          if (typeof Peer === 'undefined') {
            this.cb.onStatus('PeerJS CDN failed to load.', 'error');
            return;
          }
          const opts = {
            debug: 0,
            config: {
              iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
              ]
            }
          };
          this.peer = peerId ? new Peer(peerId, opts) : new Peer(opts);
          this.peer.on('open', (id) => onReady(id));
          this.peer.on('error', (err) => {
            if (err && err.type === 'unavailable-id' && this.role === 'host') {
              this.hostRoom();
              return;
            }
            const msg = (err && err.type === 'peer-unavailable')
              ? 'Room not found or Host disconnected.'
              : `Connection error: ${(err && (err.type || err.message)) || 'unknown'}`;
            this.cb.onStatus(msg, 'error');
          });
        }

        hostRoom() {
          this.role = 'host';
          this.roomCode = generateRoomCode();
          this.cb.onRoomCode(this.roomCode);
          this.cb.onStatus('Opening room...', 'neutral');
          this._initPeer(PEER_PREFIX + this.roomCode, () => {
            this.role = 'host';
            this.cb.onStatus(`Hosting ${this.roomCode} — waiting for player`, 'neutral');
            this.peer.on('connection', (conn) => {
              if (this.conn) { conn.close(); return; }
              this._attachConnection(conn);
            });
          });
        }

        joinRoom(codeInput) {
          const clean = codeInput.trim().toUpperCase();
          if (!clean) {
            this.cb.onStatus('Enter a room code first.', 'error');
            return;
          }
          const normalized = clean.startsWith('CRSH-') ? clean : `CRSH-${clean}`;
          this.roomCode = normalized;
          this.role = 'client';
          this.cb.onStatus(`Connecting to ${normalized}...`, 'neutral');
          this._initPeer(null, () => {
            this.role = 'client';
            const conn = this.peer.connect(PEER_PREFIX + normalized, { serialization: 'json', reliable: false });
            this._attachConnection(conn);
          });
        }

        _attachConnection(conn) {
          this.conn = conn;
          conn.on('open', () => {
            this.cb.onStatus('Connected!', 'connected');
            this.cb.onConnected(this.role);
            this._startHeartbeat();
          });
          conn.on('data', (msg) => this._handleMessage(msg));
          conn.on('close', () => {
            this.destroy();
            this.cb.onDisconnected('Opponent disconnected.');
          });
          conn.on('error', () => {
            this.destroy();
            this.cb.onDisconnected('Peer connection lost.');
          });
        }

        _startHeartbeat() {
          if (this.pingTimer) clearInterval(this.pingTimer);
          this.pingTimer = setInterval(() => {
            if (this.conn && this.conn.open) this.conn.send({ t: 'ping', ts: performance.now() });
          }, 1500);
        }

        _handleMessage(msg) {
          if (!msg || typeof msg !== 'object') return;
          switch (msg.t) {
            case 'ping':
              if (this.conn && this.conn.open) this.conn.send({ t: 'pong', ts: msg.ts });
              break;
            case 'pong':
              this.pingMs = Math.max(1, Math.round(performance.now() - msg.ts));
              this.cb.onPing(this.pingMs);
              break;
            case 'input':
              this.remoteInput = { l: !!msg.l, r: !!msg.r };
              break;
            case 'match_start':
              this.snapshotBuffer = [];
              this.lastSeq = 0;
              this.cb.onMatchStart(msg.ai || 0);
              break;
            case 'snap':
              if (msg.sq <= this.lastSeq) return;
              this.lastSeq = msg.sq;
              msg.rx = performance.now();
              this.snapshotBuffer.push(msg);
              if (this.snapshotBuffer.length > 24) this.snapshotBuffer.shift();
              this.cb.onSnapshotState(msg);
              break;
            case 'evt':
              this.cb.onGameEvent(msg);
              break;
            case 'rematch':
              this.cb.onRematchSignal();
              break;
          }
        }

        sendInputIfChanged(inp) {
          if (!this.conn || !this.conn.open) return;
          const l = !!inp.l;
          const r = !!inp.r;
          if (l !== this.lastInputSent.l || r !== this.lastInputSent.r) {
            this.lastInputSent = { l, r };
            this.conn.send({ t: 'input', l, r });
          }
        }

        sendMatchStart(arenaIndex) {
          if (this.conn && this.conn.open) this.conn.send({ t: 'match_start', ai: arenaIndex });
        }

        sendEvent(kind, data = {}) {
          if (this.conn && this.conn.open) this.conn.send({ t: 'evt', kind, ...data });
        }

        sendRematch() {
          if (this.conn && this.conn.open) this.conn.send({ t: 'rematch' });
        }

        sendHostSnapshot(sim, meta) {
          if (!this.conn || !this.conn.open) return;
          this.lastSeq++;
          const pack = (b) => ({
            x: Math.round(b.position.x * 10) / 10,
            y: Math.round(b.position.y * 10) / 10,
            a: Math.round(b.angle * 1000) / 1000
          });
          const payload = {
            t: 'snap',
            sq: this.lastSeq,
            ai: sim.arenaIndex,
            sc: meta.scores,
            rn: meta.roundNumber,
            ph: meta.phase,
            bt: meta.bannerText,
            d1: sim.p1Car.dead ? 1 : 0,
            d2: sim.p2Car.dead ? 1 : 0,
            dr1: sim.p1Car.driving ? 1 : 0,
            dr2: sim.p2Car.driving ? 1 : 0,
            sw: sim.seesaws.map((s) => ({ a: Math.round(s.body.angle * 1000) / 1000 }))
          };
          for (const [carKey, bodyKey, shortKey] of BODY_KEYS) {
            payload[shortKey] = pack(sim[carKey][bodyKey]);
          }
          this.conn.send(payload);
        }

        applyInterpolatedFrame(sim) {
          if (this.snapshotBuffer.length === 0) return;
          const renderTime = performance.now() - this.interpDelayMs;
          while (this.snapshotBuffer.length >= 2 && this.snapshotBuffer[1].rx <= renderTime) {
            this.snapshotBuffer.shift();
          }
          const s0 = this.snapshotBuffer[0];
          const s1 = this.snapshotBuffer[1];
          const alpha = s1 && s1.rx > s0.rx ? clamp((renderTime - s0.rx) / (s1.rx - s0.rx), 0, 1) : 0;

          if (sim.p1Car) sim.p1Car.driving = !!(s1 ? s1.dr1 : s0.dr1);
          if (sim.p2Car) sim.p2Car.driving = !!(s1 ? s1.dr2 : s0.dr2);

          for (const [carKey, bodyKey, shortKey] of BODY_KEYS) {
            const body = sim[carKey] && sim[carKey][bodyKey];
            if (!body) continue;
            const a = s0[shortKey];
            const b = s1 ? s1[shortKey] : a;
            if (!a || !b) continue;
            Matter.Body.setPosition(body, { x: lerp(a.x, b.x, alpha), y: lerp(a.y, b.y, alpha) });
            Matter.Body.setAngle(body, lerpAngle(a.a, b.a, alpha));
          }

          if (s0.sw && sim.seesaws.length === s0.sw.length) {
            for (let i = 0; i < sim.seesaws.length; i++) {
              const a0 = s0.sw[i].a;
              const a1 = s1 && s1.sw && s1.sw[i] ? s1.sw[i].a : a0;
              Matter.Body.setAngle(sim.seesaws[i].body, lerpAngle(a0, a1, alpha));
            }
          }
        }
      }

      // =========================================================================
      // 9. GAME ORCHESTRATOR
      // =========================================================================
      class CrashAheadGame {
        constructor() {
          this.sound = new SoundFX();
          this.canvas = document.getElementById('game-canvas');
          this.renderer = new CanvasRenderer(this.canvas);
          this.input = new InputManager(this.sound);
          this.ai = new SmartAI();
          this.sim = new PhysicsSimulation(true);

          this.mode = 'attract'; // 'attract' | 'ai' | 'local' | 'online_host' | 'online_client'
          this.phase = 'MENU';   // 'MENU' | 'FIGHT' | 'KO' | 'MATCH_OVER'
          this.scores = [0, 0];
          this.roundNumber = 1;
          this.bannerText = '';
          this.selectedArenaIdx = -1; // -1 = ALL 15 MAPS (RANDOM ROTATION), 0..14 = locked specific map
          this.attractMapTicks = 0;

          this.koPending = false;
          this.koWindowMs = 0;
          this.koTimerMs = 0;
          this.koPendingRound = 0;
          this._pendingAward = 0;

          this.p1Input = { l: false, r: false };
          this.p2Input = { l: false, r: false };
          this.localRematchWant = false;
          this.remoteRematchWant = false;

          this._cacheDOM();
          this._bindSimCallbacks();
          this._initNetwork();
          this._bindUI();

          window.addEventListener('resize', () => this.renderer.resize());
          window.addEventListener('orientationchange', () => setTimeout(() => this.renderer.resize(), 120));

          this._checkUrlAutoJoin();
          this._startAttractMode();
          this._startMainLoop();
        }

        _cacheDOM() {
          this.dom = {
            scorePill: document.getElementById('score-pill'),
            scoreP1: document.getElementById('score-p1'),
            scoreP2: document.getElementById('score-p2'),
            pingTag: document.getElementById('online-ping-tag'),
            btnExit: document.getElementById('btn-exit'),

            menuOverlay: document.getElementById('menu-overlay'),
            onlineOverlay: document.getElementById('online-overlay'),
            victoryOverlay: document.getElementById('victory-overlay'),

            mapTitle: document.getElementById('map-picker-title'),
            mapSub: document.getElementById('map-picker-sub'),
            btnCtrlToggle: document.getElementById('btn-ctrl-toggle'),
            btnMute: document.getElementById('btn-mute'),
            iconSoundOn: document.getElementById('icon-sound-on'),
            iconSoundOff: document.getElementById('icon-sound-off'),

            tabHost: document.getElementById('tab-host'),
            tabJoin: document.getElementById('tab-join'),
            panelHost: document.getElementById('panel-host'),
            panelJoin: document.getElementById('panel-join'),
            hostRoomCode: document.getElementById('host-room-code'),
            joinCodeInput: document.getElementById('join-code-input'),
            onlineStatus: document.getElementById('online-status'),
            onlineStatusText: document.getElementById('online-status-text'),
            onlineLobbyPing: document.getElementById('online-lobby-ping'),
            btnOnlineStart: document.getElementById('btn-online-start'),

            victoryTitle: document.getElementById('victory-title'),
            victoryScore: document.getElementById('victory-score'),
            victoryNote: document.getElementById('victory-note'),
            btnRematch: document.getElementById('btn-rematch')
          };
        }

        _pickArenaIndex(previousIndex = -1) {
          if (this.selectedArenaIdx >= 0) return this.selectedArenaIdx;
          let idx = Math.floor(Math.random() * ARENAS.length);
          if (ARENAS.length > 1 && idx === previousIndex) {
            idx = (idx + 1 + Math.floor(Math.random() * (ARENAS.length - 1))) % ARENAS.length;
          }
          return idx;
        }

        _updateMapPickerUI() {
          if (this.selectedArenaIdx < 0) {
            this.dom.mapTitle.textContent = 'ALL 15 MAPS (RANDOM ROTATION)';
            this.dom.mapSub.textContent = 'Rotates every round • Tap < > to pick Map 1–15';
          } else {
            const a = ARENAS[this.selectedArenaIdx];
            this.dom.mapTitle.textContent = `MAP ${a.id}/15: ${a.name}`;
            this.dom.mapSub.textContent = a.desc;
          }
        }

        _bindSimCallbacks() {
          const handleRoundKO = (loserIdx, pt, isWater) => {
            if (this.mode === 'attract') {
              if (!this.koPending) {
                this.koPending = true;
                if (!isWater) this.sim.popHelmet(loserIdx, pt);
                else {
                  const c = loserIdx === 1 ? this.sim.p1Car : this.sim.p2Car;
                  if (c) c.dead = true;
                }
                this.koTimerMs = 900;
              }
              return;
            }
            if (this.phase !== 'FIGHT') return;

            if (!isWater) {
              this.sim.popHelmet(loserIdx, pt);
              this.renderer.spawnBonkPop(pt.x, pt.y, loserIdx === 1 ? PALETTE.red.body : PALETTE.blue.body);
              this.sound.playBonk();
              if (this.mode === 'online_host') {
                this.net.sendEvent('bonk', { x: Math.round(pt.x), y: Math.round(pt.y), p: loserIdx });
              }
            } else {
              const c = loserIdx === 1 ? this.sim.p1Car : this.sim.p2Car;
              if (c) c.dead = true;
              this.renderer.spawnWaterSplash(pt.x);
              this.sound.playSplash();
              if (this.mode === 'online_host') {
                this.net.sendEvent('splash', { x: Math.round(pt.x) });
              }
            }

            Haptics.ko();

            if (!this.koPending) {
              this.koPending = true;
              this.koWindowMs = DOUBLE_KO_WINDOW_MS;
              this._pendingAward = loserIdx === 1 ? 2 : 1;
            } else if (this._pendingAward !== 0 && this._pendingAward !== (loserIdx === 1 ? 2 : 1)) {
              this._pendingAward = 0; // Double KO within 100ms
            }
          };

          this.sim.onHeadKO = (loserIdx, pt) => handleRoundKO(loserIdx, pt, false);
          this.sim.onWaterKO = (loserIdx, pt) => handleRoundKO(loserIdx, pt, true);
          this.sim.onCarBump = (_pt, norm) => {
            if (this.mode === 'attract') return;
            this.sound.playBump(norm);
            if (norm > 0.4) Haptics.bump();
            if (this.mode === 'online_host') this.net.sendEvent('bump', { n: Math.round(norm * 100) / 100 });
          };
        }

        _initNetwork() {
          this.net = new NetworkManager({
            onRoomCode: (code) => { this.dom.hostRoomCode.textContent = code; },
            onStatus: (text, cls) => {
              this.dom.onlineStatusText.textContent = text;
              this.dom.onlineStatus.className = `status-pill ${cls}`;
            },
            onConnected: (role) => {
              this.dom.onlineStatusText.textContent = role === 'host' ? 'Player 2 Connected!' : 'Connected to Host!';
              this.dom.onlineStatus.className = 'status-pill connected';
              this.dom.btnOnlineStart.disabled = role !== 'host';
              this.dom.btnOnlineStart.textContent = role === 'host' ? 'START MATCH!' : 'WAITING FOR HOST...';
            },
            onPing: (ms) => {
              this.dom.onlineLobbyPing.textContent = `${ms}ms`;
              this.dom.pingTag.textContent = `${ms}ms`;
            },
            onMatchStart: (arenaIdx) => {
              this.startMatch('online_client', arenaIdx);
            },
            onSnapshotState: (snap) => {
              if (this.mode !== 'online_client') return;
              if (snap.rn !== this.roundNumber || snap.ai !== this.sim.arenaIndex) {
                this.roundNumber = snap.rn;
                this.koPendingRound = 0;
                this.sim.resetArena(snap.ai || 0);
                this.renderer.clearEffects();
              }
              if (snap.sc[0] !== this.scores[0] || snap.sc[1] !== this.scores[1]) {
                this.scores = [snap.sc[0], snap.sc[1]];
                this._updateScoreUI();
              }
              const staleFight = this.koPendingRound === snap.rn && snap.ph === 'FIGHT';
              if (!staleFight) this.phase = snap.ph;
              if (snap.ph === 'KO') this.koPendingRound = snap.rn;
              this.bannerText = snap.bt || '';
              if (this.sim.p1Car) this.sim.p1Car.dead = !!snap.d1;
              if (this.sim.p2Car) this.sim.p2Car.dead = !!snap.d2;
            },
            onGameEvent: (msg) => {
              if (msg.kind === 'bump') {
                this.sound.playBump(msg.n || 0.5);
                if (msg.n > 0.4) Haptics.bump();
              } else if (msg.kind === 'bonk') {
                this.koPendingRound = this.roundNumber;
                this.phase = 'KO';
                this.bannerText = 'BONK!';
                this.renderer.spawnBonkPop(msg.x, msg.y, msg.p === 1 ? PALETTE.red.body : PALETTE.blue.body);
                this.sound.playBonk();
                Haptics.ko();
              } else if (msg.kind === 'splash') {
                this.koPendingRound = this.roundNumber;
                this.phase = 'KO';
                this.bannerText = 'SPLASH!';
                this.renderer.spawnWaterSplash(msg.x);
                this.sound.playSplash();
                Haptics.ko();
              } else if (msg.kind === 'match_over') {
                this.scores = msg.scores;
                this._updateScoreUI();
                this._showVictory();
              } else if (msg.kind === 'rematch_start') {
                this.startMatch('online_client', msg.ai || 0);
              }
            },
            onRematchSignal: () => {
              this.remoteRematchWant = true;
              if (this.mode === 'online_host') {
                if (this.localRematchWant) this._triggerOnlineRematch();
                else this.dom.victoryNote.textContent = 'Opponent wants a rematch!';
              } else {
                this.dom.victoryNote.textContent = 'Host wants a rematch!';
              }
            },
            onDisconnected: (reason) => {
              this.input.setMode('menu');
              this.sound.updateEngine(false, 0, 0);
              this.dom.scorePill.classList.add('hidden');
              this.dom.btnExit.classList.add('hidden');
              this.dom.victoryOverlay.classList.add('hidden');
              this.dom.onlineOverlay.classList.remove('hidden');
              this.dom.onlineStatusText.textContent = reason;
              this.dom.onlineStatus.className = 'status-pill error';
              this.dom.btnOnlineStart.disabled = true;
              this.dom.btnOnlineStart.textContent = 'WAITING FOR OPPONENT...';
            }
          });
        }

        _bindUI() {
          document.getElementById('force-landscape-btn').addEventListener('click', () => {
            document.body.classList.add('force-landscape');
            setTimeout(() => this.renderer.resize(), 60);
          });

          this.dom.btnMute.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.setMuted(!this.sound.muted);
            this._updateSoundUI();
            this.sound.playClick();
          });
          this._updateSoundUI();

          document.getElementById('btn-fullscreen').addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            const docEl = document.documentElement;
            if (!document.fullscreenElement) {
              if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
              document.exitFullscreen().catch(() => {});
            }
          });

          // Map Selector Pill cycling (-1 = Random Rotation, 0..14 = Specific Map 1..15)
          const stepMap = (delta) => {
            this.sound.unlock();
            this.sound.playClick();
            const total = ARENAS.length + 1; // -1, 0 .. 14
            const cur = this.selectedArenaIdx + 1;
            const next = ((cur + delta) % total + total) % total;
            this.selectedArenaIdx = next - 1;
            this._updateMapPickerUI();
            if (this.mode === 'attract') {
              const previewIdx = this.selectedArenaIdx >= 0 ? this.selectedArenaIdx : 0;
              this.sim.resetArena(previewIdx);
              this.renderer.clearEffects();
            }
          };
          document.getElementById('btn-map-prev').addEventListener('click', () => stepMap(-1));
          document.getElementById('btn-map-next').addEventListener('click', () => stepMap(1));
          document.getElementById('btn-map-cycle').addEventListener('click', () => stepMap(1));
          this._updateMapPickerUI();

          const syncCtrlLabel = () => {
            this.dom.btnCtrlToggle.textContent =
              this.input.singleLayout === 'split' ? '1P TOUCH: SPLIT THUMBS' : '1P TOUCH: SIDE PAIR';
          };
          syncCtrlLabel();
          this.dom.btnCtrlToggle.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            this.input.setSingleLayout(this.input.singleLayout === 'split' ? 'grouped' : 'split');
            syncCtrlLabel();
          });

          document.getElementById('btn-mode-local').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick(); this.startMatch('local');
          });
          document.getElementById('btn-mode-ai').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick(); this.startMatch('ai');
          });
          document.getElementById('btn-mode-online').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick(); this._openOnlineModal('host');
          });

          document.getElementById('btn-online-back').addEventListener('click', () => {
            this.sound.playClick();
            this.net.destroy();
            this.dom.onlineOverlay.classList.add('hidden');
            this.dom.menuOverlay.classList.remove('hidden');
          });

          this.dom.tabHost.addEventListener('click', () => { this.sound.playClick(); this._switchOnlineTab('host'); });
          this.dom.tabJoin.addEventListener('click', () => { this.sound.playClick(); this._switchOnlineTab('join'); });

          document.getElementById('btn-copy-code').addEventListener('click', (e) => {
            this.sound.playClick();
            this._copyWithFeedback(this.dom.hostRoomCode.textContent, e.currentTarget, 'COPY CODE');
          });
          document.getElementById('btn-copy-link').addEventListener('click', (e) => {
            this.sound.playClick();
            const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(this.dom.hostRoomCode.textContent)}`;
            this._copyWithFeedback(url, e.currentTarget, 'COPY LINK');
          });

          document.getElementById('btn-join-connect').addEventListener('click', () => {
            this.sound.unlock(); this.sound.playClick();
            this.net.joinRoom(this.dom.joinCodeInput.value);
          });
          this.dom.joinCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-join-connect').click();
          });

          this.dom.btnOnlineStart.addEventListener('click', () => {
            if (this.net.role !== 'host') return;
            this.sound.unlock();
            this.sound.playClick();
            const arenaIdx = this._pickArenaIndex(-1);
            this.net.sendMatchStart(arenaIdx);
            this.startMatch('online_host', arenaIdx);
          });

          this.dom.btnExit.addEventListener('click', () => {
            this.sound.playClick();
            this.net.destroy();
            this._startAttractMode();
          });

          this.dom.btnRematch.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playClick();
            if (this.mode === 'online_host' || this.mode === 'online_client') {
              this.localRematchWant = true;
              this.net.sendRematch();
              this.dom.btnRematch.disabled = true;
              this.dom.btnRematch.textContent = 'WAITING...';
              if (this.mode === 'online_host' && this.remoteRematchWant) this._triggerOnlineRematch();
            } else {
              this.dom.victoryOverlay.classList.add('hidden');
              this.startMatch(this.mode);
            }
          });

          document.getElementById('btn-victory-menu').addEventListener('click', () => {
            this.sound.playClick();
            this.net.destroy();
            this._startAttractMode();
          });
        }

        _copyWithFeedback(text, btn, originalText) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              btn.textContent = 'COPIED!';
              setTimeout(() => { btn.textContent = originalText; }, 1200);
            }).catch(() => {});
          }
        }

        _updateSoundUI() {
          this.dom.iconSoundOn.classList.toggle('hidden', this.sound.muted);
          this.dom.iconSoundOff.classList.toggle('hidden', !this.sound.muted);
        }

        _openOnlineModal(tab) {
          this.dom.menuOverlay.classList.add('hidden');
          this.dom.onlineOverlay.classList.remove('hidden');
          this._switchOnlineTab(tab);
        }

        _switchOnlineTab(tab) {
          this.dom.tabHost.classList.toggle('active', tab === 'host');
          this.dom.tabJoin.classList.toggle('active', tab === 'join');
          this.dom.panelHost.classList.toggle('hidden', tab !== 'host');
          this.dom.panelJoin.classList.toggle('hidden', tab !== 'join');
          this.dom.btnOnlineStart.disabled = true;
          this.dom.btnOnlineStart.textContent = tab === 'host' ? 'WAITING FOR OPPONENT...' : 'WAITING FOR HOST...';
          this.dom.onlineLobbyPing.textContent = '';

          if (tab === 'host') {
            this.net.hostRoom();
          } else {
            this.net.destroy();
            this.dom.onlineStatusText.textContent = 'Enter friend room code to join.';
            this.dom.onlineStatus.className = 'status-pill';
            setTimeout(() => this.dom.joinCodeInput.focus(), 80);
          }
        }

        _checkUrlAutoJoin() {
          const room = new URLSearchParams(window.location.search).get('room');
          if (!room) return;
          this._openOnlineModal('join');
          this.dom.joinCodeInput.value = room.toUpperCase();
          setTimeout(() => this.net.joinRoom(room), 300);
        }

        _startAttractMode() {
          this.mode = 'attract';
          this.phase = 'MENU';
          this.scores = [0, 0];
          this.bannerText = '';
          this.koPending = false;
          this.input.setMode('menu');
          this.sound.updateEngine(false, 0, 0);

          this.dom.scorePill.classList.add('hidden');
          this.dom.btnExit.classList.add('hidden');
          this.dom.pingTag.classList.add('hidden');
          this.dom.victoryOverlay.classList.add('hidden');
          this.dom.onlineOverlay.classList.add('hidden');
          this.dom.menuOverlay.classList.remove('hidden');

          this.sim.isHostSide = true;
          const previewIdx = this.selectedArenaIdx >= 0 ? this.selectedArenaIdx : 0;
          this.sim.resetArena(previewIdx);
          this.renderer.clearEffects();
        }

        startMatch(mode, explicitArenaIdx = null) {
          this.mode = mode;
          this.scores = [0, 0];
          this.roundNumber = 1;
          this.koPendingRound = 0;
          this.localRematchWant = false;
          this.remoteRematchWant = false;

          this.dom.menuOverlay.classList.add('hidden');
          this.dom.onlineOverlay.classList.add('hidden');
          this.dom.victoryOverlay.classList.add('hidden');
          this.dom.scorePill.classList.remove('hidden');
          this.dom.btnExit.classList.remove('hidden');
          this.dom.pingTag.classList.toggle('hidden', mode !== 'online_host' && mode !== 'online_client');

          this.sim.isHostSide = mode !== 'online_client';
          this.input.setMode(mode);
          this._updateScoreUI();

          const startIdx = explicitArenaIdx !== null ? explicitArenaIdx : this._pickArenaIndex(-1);
          this._resetRound(startIdx);
        }

        _triggerOnlineRematch() {
          const arenaIdx = this._pickArenaIndex(this.sim.arenaIndex);
          this.net.sendEvent('rematch_start', { ai: arenaIdx });
          this.startMatch('online_host', arenaIdx);
        }

        _resetRound(explicitArenaIdx = null) {
          this.phase = 'FIGHT';
          this.bannerText = '';
          this.koPending = false;
          this.koWindowMs = 0;
          this.koTimerMs = 0;
          this._pendingAward = 0;
          this.p1Input = { l: false, r: false };
          this.p2Input = { l: false, r: false };

          const nextIdx = explicitArenaIdx !== null ? explicitArenaIdx : this._pickArenaIndex(this.sim.arenaIndex);
          this.sim.resetArena(nextIdx);
          this.renderer.clearEffects();
        }

        _updateScoreUI() {
          this.dom.scoreP1.textContent = String(this.scores[0]);
          this.dom.scoreP2.textContent = String(this.scores[1]);
        }

        _showVictory() {
          this.phase = 'MATCH_OVER';
          this.sound.updateEngine(false, 0, 0);
          this.sound.playVictory();
          this.input.setMode('menu');
          this.dom.victoryTitle.textContent = this.scores[0] >= WIN_SCORE ? 'RED WINS!' : 'BLUE WINS!';
          this.dom.victoryScore.textContent = `${this.scores[0]} • ${this.scores[1]}`;
          this.dom.victoryNote.textContent = '';
          this.dom.btnRematch.disabled = false;
          this.dom.btnRematch.textContent = 'PLAY AGAIN';
          this.dom.victoryOverlay.classList.remove('hidden');
        }

        _stepAttractTick() {
          if (this.koPending) {
            this.sim.step({ l: false, r: false }, { l: false, r: false }, false);
            this.koTimerMs -= FIXED_DT;
            if (this.koTimerMs <= 0) {
              this.koPending = false;
              const nextIdx = this.selectedArenaIdx >= 0
                ? this.selectedArenaIdx
                : (this.sim.arenaIndex + 1) % ARENAS.length;
              this.sim.resetArena(nextIdx);
              this.renderer.clearEffects();
            }
          } else {
            this.attractMapTicks++;
            if (this.attractMapTicks > 540 && this.selectedArenaIdx < 0) {
              this.attractMapTicks = 0;
              this.sim.resetArena((this.sim.arenaIndex + 1) % ARENAS.length);
              this.renderer.clearEffects();
            }
            this.sim.step(this.ai.decide(this.sim, true), this.ai.decide(this.sim, false), true);
          }
        }

        _stepAuthoritativeTick() {
          if (this.phase === 'MATCH_OVER') return;

          if (this.koPending && this.koWindowMs > 0) {
            this.koWindowMs -= FIXED_DT;
            if (this.koWindowMs <= 0) {
              this.phase = 'KO';
              this.koTimerMs = KO_FREEZE_MS;
              this.sim.engine.timing.timeScale = 0.25;
              this.bannerText = this._pendingAward === 0 ? 'DRAW!' : 'BONK!';
            }
          }

          if (this.phase === 'KO') {
            this.sim.step({ l: false, r: false }, { l: false, r: false }, false);
            this.koTimerMs -= FIXED_DT;
            if (this.koTimerMs <= 0) {
              if (this._pendingAward === 1) this.scores[0]++;
              else if (this._pendingAward === 2) this.scores[1]++;
              this._updateScoreUI();

              if (this.scores[0] >= WIN_SCORE || this.scores[1] >= WIN_SCORE) {
                if (this.mode === 'online_host') this.net.sendEvent('match_over', { scores: this.scores });
                this._showVictory();
                return;
              }
              this.roundNumber++;
              this._resetRound();
            }
          } else {
            this.p1Input = this.input.getP1();
            if (this.mode === 'ai') this.p2Input = this.ai.decide(this.sim, false);
            else if (this.mode === 'local') this.p2Input = this.input.getP2();
            else if (this.mode === 'online_host') this.p2Input = this.net.remoteInput;

            this.sim.step(this.p1Input, this.p2Input, true);
          }

          if (this.mode === 'online_host') {
            this.net.sendHostSnapshot(this.sim, {
              scores: this.scores,
              roundNumber: this.roundNumber,
              phase: this.phase,
              bannerText: this.bannerText
            });
          }
        }

        _updateAudio() {
          if (this.mode === 'attract' || this.phase !== 'FIGHT') {
            this.sound.updateEngine(false, 0, 0);
            return;
          }
          const t1 = (this.p1Input.l || this.p1Input.r) ? 1 : 0;
          const t2 = (this.p2Input.l || this.p2Input.r) ? 1 : 0;
          const throttle = this.mode === 'online_client'
            ? ((this.input.state.p1_l || this.input.state.p1_r || this.input.state.p2_l || this.input.state.p2_r) ? 1 : 0)
            : Math.max(t1, t2 * 0.65);
          let spd = 0;
          if (this.sim.p1Car) spd = Math.max(spd, Math.abs(this.sim.p1Car.wheelF.angularVelocity));
          if (this.sim.p2Car) spd = Math.max(spd, Math.abs(this.sim.p2Car.wheelF.angularVelocity));
          this.sound.updateEngine(true, throttle, clamp(spd / CAR_SPEC.maxWheelSpin, 0, 1));
        }

        _startMainLoop() {
          let last = performance.now();
          let acc = 0;

          const loop = (now) => {
            const elapsed = Math.min(100, now - last);
            last = now;

            if (this.mode === 'online_client') {
              this.net.sendInputIfChanged(this.input.getP2());
              this.net.applyInterpolatedFrame(this.sim);
            } else {
              acc += elapsed;
              while (acc >= FIXED_DT) {
                if (this.mode === 'attract') this._stepAttractTick();
                else this._stepAuthoritativeTick();
                acc -= FIXED_DT;
              }
            }

            this.renderer.updateEffects(elapsed / FIXED_DT, this.sim);
            this._updateAudio();
            this.renderer.render(this.sim, this.bannerText);
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        if (typeof Matter === 'undefined') {
          document.body.innerHTML = '<div style="padding:32px;text-align:center;"><h2>Matter.js Failed to Load</h2><p>Check your connection and refresh.</p></div>';
          return;
        }
        window.__crashAheadGame = new CrashAheadGame();
        window.__crashAheadArenas = ARENAS;
      });
    })();
  </script>
</body>
