<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAD6BE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Crash Ahead! — 1v1 Cartoon Physics Car Battle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@700;800&display=swap" rel="stylesheet">

  <!-- Matter.js 0.19.0 2D Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- PeerJS 1.5.4 WebRTC P2P Networking -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --sky-peach: #FAD6BE;
      --ink: #111111;
      --red: #F25C54;
      --red-dark: #C93B33;
      --blue: #00B4FF;
      --blue-dark: #0082B8;
      --yellow: #F7B538;
      --yellow-dark: #D4921C;
      --slate: #3A3E42;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--sky-peach);
      font-family: 'Fredoka', 'Rubik', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    .hidden {
      display: none !important;
    }

    /* Full-Bleed Responsive 16:9 Stage */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--sky-peach);
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100vw * 9 / 16));
      touch-action: none;
    }

    /* Top-Center White Score Half-Pill & Bottom-Center White EXIT Half-Pill */
    .hud-pill {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: var(--white);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .top-pill {
      top: 0;
      padding: 6px 26px 9px;
      border-radius: 0 0 36px 36px;
      gap: 10px;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.5px;
      border: 4px solid var(--ink);
      border-top: none;
      pointer-events: none;
    }

    .score-red { color: var(--red); }
    .score-sep { color: var(--slate); font-size: 0.78em; }
    .score-blue { color: var(--blue); }

    .ping-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--slate);
      background: #EEF1F4;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 2px;
    }

    .bottom-pill {
      bottom: 0;
      padding: 10px 30px 7px;
      border-radius: 36px 36px 0 0;
      border: 4px solid var(--ink);
      border-bottom: none;
      font-family: inherit;
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 800;
      color: var(--slate);
      letter-spacing: 1px;
      cursor: pointer;
    }

    .bottom-pill:active {
      background: #F0F2F4;
    }

    /* Subtle Active Map Watermark Tag Top-Right (Only small helper badge during play? No, kept strictly screenshot-clean; shown in lobby/map picker) */

    /* Circular Tactile Cartoon Arrow Controls */
    #touch-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .btn-pair {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 18px;
      pointer-events: none;
    }

    .left-pair { left: max(26px, env(safe-area-inset-left, 0px)); }
    .right-pair { right: max(26px, env(safe-area-inset-right, 0px)); }

    .circle-pad {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      -webkit-touch-callout: none;
      outline: none;
      box-shadow: inset 0 -7px 0 rgba(0, 0, 0, 0.22);
      transition: transform 0.06s ease;
    }

    .pad-red { background: var(--red); }
    .pad-blue { background: var(--blue); }

    .circle-pad svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: var(--ink);
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .pad-tag {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--white);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      line-height: 1.15;
      pointer-events: none;
      white-space: nowrap;
    }

    #touch-controls.mode-2p .pad-tag {
      display: none;
    }

    .circle-pad.pressed {
      transform: translateY(3px) scale(0.94);
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25);
    }

    /* Split-Thumbs 1P Layout: Left button on bottom-left, Right button on bottom-right */
    #touch-controls.mode-1p-split .btn-pair {
      display: contents;
    }

    #touch-controls.mode-1p-split .pad-left-btn {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      left: max(26px, env(safe-area-inset-left, 0px));
      pointer-events: auto;
    }

    #touch-controls.mode-1p-split .pad-right-btn {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      right: max(26px, env(safe-area-inset-right, 0px));
      pointer-events: auto;
    }

    @media (max-height: 460px), (max-width: 760px) {
      .btn-pair {
        bottom: 14px;
        gap: 14px;
      }
      .left-pair { left: 16px; }
      .right-pair { right: 16px; }
      #touch-controls.mode-1p-split .pad-left-btn {
        bottom: 14px;
        left: 16px;
      }
      #touch-controls.mode-1p-split .pad-right-btn {
        bottom: 14px;
        right: 16px;
      }
      .circle-pad {
        width: 68px;
        height: 68px;
        border-width: 4.5px;
      }
      .circle-pad svg {
        width: 32px;
        height: 32px;
      }
    }

    /* Flat-Vector White Cartoon Menu & Modals */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(17, 17, 17, 0.14);
    }

    .lobby-card {
      width: min(490px, 95vw);
      max-height: 94vh;
      overflow-y: auto;
      background: var(--white);
      border: 5px solid var(--ink);
      border-radius: 28px;
      padding: 20px 22px 18px;
      box-shadow: 0 10px 0 var(--ink);
    }

    .lobby-card.compact {
      width: min(430px, 94vw);
    }

    .lobby-card.center {
      text-align: center;
    }

    .lobby-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .game-title {
      font-size: clamp(26px, 4.8vw, 34px);
      font-weight: 800;
      line-height: 1.02;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .game-title.small {
      font-size: 24px;
    }

    .game-sub {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #5A5F66;
      letter-spacing: 0.5px;
    }

    .mini-tools {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .mini-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3.5px solid var(--ink);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-circle-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--ink);
    }

    .mini-circle-btn:active {
      transform: translateY(2px);
    }

    .mini-pill-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      border: 3.5px solid var(--ink);
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
    }

    /* Map Picker Stepper Inside Cartoon Card */
    .map-picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      background: #F4F5F7;
      border: 4px solid var(--ink);
      border-radius: 18px;
      padding: 5px 6px;
    }

    .map-step-btn {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 12px;
      border: 3px solid var(--ink);
      background: var(--white);
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
    }

    .map-step-btn:active {
      transform: translateY(2px);
    }

    .map-picker-label {
      flex: 1;
      text-align: center;
      border: none;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
      padding: 2px 4px;
    }

    .map-picker-main {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.15;
    }

    .map-picker-sub {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: #5A5F66;
      margin-top: 1px;
    }

    .mode-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .cartoon-btn {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 4px solid var(--ink);
      cursor: pointer;
      text-align: center;
      transition: transform 0.06s ease;
    }

    .cartoon-btn.btn-sm {
      font-size: 14px;
      padding: 9px 12px;
    }

    .btn-red {
      background: var(--red);
      color: var(--white);
      box-shadow: inset 0 -5px 0 var(--red-dark);
    }

    .btn-blue {
      background: var(--blue);
      color: var(--white);
      box-shadow: inset 0 -5px 0 var(--blue-dark);
    }

    .btn-yellow {
      background: var(--yellow);
      color: var(--ink);
      box-shadow: inset 0 -5px 0 var(--yellow-dark);
    }

    .cartoon-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .cartoon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .lobby-footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toggle-chip {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      border: 3px solid var(--ink);
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
    }

    .keys-hint {
      font-size: 11px;
      font-weight: 700;
      color: #5A5F66;
    }

    /* Online P2P Card */
    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-row .cartoon-btn:not(.active) {
      background: #EAECEF;
      color: var(--slate);
      box-shadow: inset 0 -4px 0 #CFD4DA;
    }

    .online-panel {
      margin-bottom: 12px;
    }

    .code-display-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border: 4px solid var(--ink);
      border-radius: 16px;
      background: #FFF6E8;
      margin-bottom: 8px;
    }

    .code-label {
      font-size: 12px;
      font-weight: 800;
      color: #5A5F66;
    }

    .code-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--ink);
    }

    .copy-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .join-input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .code-input {
      font-family: inherit;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 8px 10px;
      border-radius: 16px;
      border: 4px solid var(--ink);
      outline: none;
      width: 100%;
    }

    .status-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 14px;
      border: 3px solid var(--ink);
      background: #F4F5F7;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .status-pill.connected { background: #E3F9EC; }
    .status-pill.error { background: #FFE6E4; }

    /* Victory Modal */
    .victory-score {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      margin: 6px 0 8px;
    }

    .victory-note {
      min-height: 18px;
      font-size: 13px;
      font-weight: 700;
      color: #5A5F66;
      margin-bottom: 12px;
    }

    /* Portrait Orientation Enforcement */
    #rotate-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--sky-peach);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .rotate-card {
      width: min(360px, 90vw);
      background: var(--white);
      border: 5px solid var(--ink);
      border-radius: 26px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 0 var(--ink);
    }

    .rotate-card h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .rotate-card p {
      font-size: 14px;
      font-weight: 600;
      color: #5A5F66;
      margin-bottom: 16px;
    }

    .phone-icon-anim {
      width: 44px;
      height: 70px;
      margin: 0 auto 14px;
      border: 4px solid var(--ink);
      border-radius: 10px;
      background: var(--blue);
      animation: tilt-phone 1.6s ease-in-out infinite;
    }

    @keyframes tilt-phone {
      0%, 20% { transform: rotate(0deg); }
      50%, 75% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      body:not(.force-landscape) #rotate-overlay {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Portrait Orientation Enforcement Overlay -->
  <div id="rotate-overlay" role="dialog" aria-label="Rotate Device">
    <div class="rotate-card">
      <div class="phone-icon-anim"></div>
      <h2>ROTATE TO LANDSCAPE</h2>
      <p>Crash Ahead plays best sideways for full multi-touch control.</p>
      <button id="force-landscape-btn" class="cartoon-btn btn-blue" type="button">PLAY ANYWAY</button>
    </div>
  </div>

  <!-- Full-Bleed Responsive Cartoon Stage -->
  <div id="stage">
    <canvas id="game-canvas"></canvas>

    <!-- Top-Center White Score Half-Pill -->
    <div id="score-pill" class="hud-pill top-pill hidden" aria-live="polite">
      <span id="score-p1" class="score-red">0</span>
      <span class="score-sep">&bull;</span>
      <span id="score-p2" class="score-blue">0</span>
      <span id="online-ping-tag" class="ping-tag hidden">0ms</span>
    </div>

    <!-- Bottom-Center White EXIT Half-Pill -->
    <button id="btn-exit" class="hud-pill bottom-pill hidden" type="button">EXIT</button>

    <!-- Unified Touch & Pointer Circular Cartoon Controls -->
    <div id="touch-controls">
      <div id="group-p1" class="btn-pair left-pair">
        <button id="pad-p1-l" class="circle-pad pad-red" type="button" aria-label="Red Reverse or Left">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M24 10 L13 20 L24 30" />
          </svg>
          <span class="pad-tag">REV</span>
        </button>
        <button id="pad-p1-r" class="circle-pad pad-red" type="button" aria-label="Red Gas or Right">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M16 10 L27 20 L16 30" />
          </svg>
          <span class="pad-tag">GAS</span>
        </button>
      </div>

      <div id="group-p2" class="btn-pair right-pair">
        <button id="pad-p2-l" class="circle-pad pad-blue" type="button" aria-label="Blue Gas or Left">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M24 10 L13 20 L24 30" />
          </svg>
          <span class="pad-tag">GAS</span>
        </button>
        <button id="pad-p2-r" class="circle-pad pad-blue" type="button" aria-label="Blue Reverse or Right">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M16 10 L27 20 L16 30" />
          </svg>
          <span class="pad-tag">REV</span>
        </button>
      </div>
    </div>

    <!-- Clean Flat-Vector Menu Modal -->
    <div id="menu-overlay" class="overlay">
      <div class="lobby-card">
        <div class="lobby-top-row">
          <div class="title-wrap">
            <h1 class="game-title">CRASH AHEAD!</h1>
            <p class="game-sub">FIRST TO 5 BONKS OR WATER SPLASHES</p>
          </div>
          <div class="mini-tools">
            <button id="btn-mute" class="mini-circle-btn" type="button" title="Sound" aria-label="Toggle Sound">
              <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.7-1-3.2-2.5-3.9v7.8c1.5-.7 2.5-2.2 2.5-3.9zM14 4.2v2c2.8.8 4.8 3.2 4.8 5.8s-2 5-4.8 5.8v2c3.9-.9 6.8-4.2 6.8-7.8S17.9 5.1 14 4.2z"/></svg>
              <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.7-1-3.2-2.5-3.9v2.2l2.4 2.4c.1-.2.1-.5.1-.7zm4.3 0c0-3.6-2.9-6.9-6.8-7.8v2c2.8.8 4.8 3.2 4.8 5.8 0 .9-.2 1.8-.7 2.6l1.5 1.5c.8-1.2 1.2-2.6 1.2-4.1zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.2 4.2c-.7.5-1.4.9-2.2 1.1v2c1.4-.3 2.6-.9 3.7-1.8L19.7 21 21 19.7 4.3 3zM12 5L9.9 7.1 12 9.2V5z"/></svg>
            </button>
            <button id="btn-fullscreen" class="mini-circle-btn" type="button" title="Fullscreen" aria-label="Toggle Fullscreen">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>

        <!-- Map Picker Pill -->
        <div class="map-picker-row">
          <button id="btn-map-prev" class="map-step-btn" type="button" aria-label="Previous Map">&lt;</button>
          <button id="btn-map-cycle" class="map-picker-label" type="button" title="Cycle Map">
            <span id="map-picker-title" class="map-picker-main">ALL 9 MAPS (IN ORDER)</span>
            <span id="map-picker-sub" class="map-picker-sub">Plays Maps 1&ndash;9 in exact order &bull; Tap arrows to lock</span>
          </button>
          <button id="btn-map-next" class="map-step-btn" type="button" aria-label="Next Map">&gt;</button>
        </div>

        <div class="mode-stack">
          <button id="btn-mode-local" class="cartoon-btn btn-red" type="button">2 PLAYER (SAME DEVICE)</button>
          <button id="btn-mode-online" class="cartoon-btn btn-blue" type="button">ONLINE 1v1 (ROOM CODE)</button>
          <button id="btn-mode-ai" class="cartoon-btn btn-yellow" type="button">1 PLAYER (VS BOT)</button>
        </div>

        <div class="lobby-footer">
          <button id="btn-ctrl-toggle" class="toggle-chip" type="button">1P TOUCH: SPLIT THUMBS</button>
          <span class="keys-hint">KEYS: A / D (RED) &bull; &larr; / &rarr; (BLUE)</span>
        </div>
      </div>
    </div>

    <!-- Online P2P Room Card -->
    <div id="online-overlay" class="overlay hidden">
      <div class="lobby-card compact">
        <div class="lobby-top-row">
          <h2 class="game-title small">ONLINE 1v1</h2>
          <button id="btn-online-back" class="mini-pill-btn" type="button">BACK</button>
        </div>

        <div class="tab-row">

      const CAR_SPEC = {

      function clamp(v, min, max) {
        return v < min ? min : v > max ? max : v;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function normalizeAngle(a) {
        let r = a % (Math.PI * 2);
        if (r > Math.PI) r -= Math.PI * 2;
        if (r < -Math.PI) r += Math.PI * 2;
        return r;
      }

      function lerpAngle(a, b, t) {
        return a + normalizeAngle(b - a) * t;
      }

      // =========================================================================
      // 2. SOUND FX & HAPTICS
      // =========================================================================
      class SoundFX {
        constructor() {
          this.ctx = null;
          this.muted = localStorage.getItem('crashahead_muted') === '1';
          this.engineOsc = null;
          this.engineGain = null;
          this.lastBumpAt = 0;
        }

        unlock() {
          if (!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            this.ctx = new Ctx();
          }
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
          if (!this.engineOsc && this.ctx) {
            try {
              const osc = this.ctx.createOscillator();
              const filter = this.ctx.createBiquadFilter();
              const gain = this.ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.value = 54;
              filter.type = 'lowpass';
              filter.frequency.value = 210;
              gain.gain.value = 0;
              osc.connect(filter);
              filter.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              this.engineOsc = osc;
              this.engineGain = gain;
            } catch (_) {}
          }
        }

        setMuted(m) {
          this.muted = !!m;
          localStorage.setItem('crashahead_muted', this.muted ? '1' : '0');
          if (this.muted && this.engineGain && this.ctx) {
            this.engineGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.04);
          }
        }

        updateEngine(active, throttle, speedNorm) {
          if (!this.ctx || !this.engineGain || !this.engineOsc) return;
          const now = this.ctx.currentTime;
          if (this.muted || !active) {
            this.engineGain.gain.setTargetAtTime(0, now, 0.05);
            return;
          }
          const targetFreq = 52 + throttle * 46 + speedNorm * 40;
          const targetVol = 0.014 + throttle * 0.028;
          this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.06);
          this.engineGain.gain.setTargetAtTime(targetVol, now, 0.06);
        }

        playBump(strength = 0.6) {
          if (this.muted || !this.ctx) return;
          const nowMs = performance.now();
          if (nowMs - this.lastBumpAt < 70) return;
          this.lastBumpAt = nowMs;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160 + strength * 70, t);
          osc.frequency.exponentialRampToValueAtTime(52, t + 0.09);
          gain.gain.setValueAtTime(Math.min(0.18, 0.06 + strength * 0.12), t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.11);
        }

        playBonk() {
          if (this.muted || !this.ctx) return;
          const t = this.ctx.currentTime;
          const o1 = this.ctx.createOscillator();
          const g1 = this.ctx.createGain();
          o1.type = 'sine';
          o1.frequency.setValueAtTime(340, t);
          o1.frequency.exponentialRampToValueAtTime(95, t + 0.16);
          g1.gain.setValueAtTime(0.28, t);
          g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          o1.connect(g1);
          g1.connect(this.ctx.destination);
          o1.start(t);
          o1.stop(t + 0.19);
        }

        playSplash() {
          if (this.muted || !this.ctx) return;
          const t = this.ctx.currentTime;
          const dur = 0.34;
          const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          let lfsr = 0x9E3779B9;
          for (let i = 0; i < data.length; i++) {
            lfsr ^= lfsr << 13;
            lfsr ^= lfsr >>> 17;
            lfsr ^= lfsr << 5;
            const norm = ((lfsr >>> 0) / 4294967295) * 2 - 1;
            data[i] = norm * Math.exp(-i / (data.length * 0.32));
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(750, t);
          bp.frequency.exponentialRampToValueAtTime(240, t + dur);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.26, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
          src.connect(bp);
          bp.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(t);
        }

        playVictory() {
          if (this.muted || !this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          const t0 = this.ctx.currentTime;
          notes.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const s = t0 + idx * 0.095;
            osc.frequency.setValueAtTime(f, s);
            gain.gain.setValueAtTime(0.16, s);
            gain.gain.exponentialRampToValueAtTime(0.001, s + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(s);
            osc.stop(s + 0.3);
          });
        }

        playClick() {
          if (this.muted || !this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(620, t);
          osc.frequency.exponentialRampToValueAtTime(380, t + 0.045);
          gain.gain.setValueAtTime(0.09, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.055);
        }
      }

      const Haptics = {
        bump() { try { if (navigator.vibrate) navigator.vibrate(20); } catch (_) {} },
        ko() { try { if (navigator.vibrate) navigator.vibrate(140); } catch (_) {} }
      };

      // =========================================================================
      // 3. DETERMINISTIC 9-MAP CONFIGURATION MODULE (STRICTLY 9 CORE MAPS)
      // =========================================================================
      function sampleArcPoints(cx, cy, r, aStart, aEnd, steps = 16) {
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const a = lerp(aStart, aEnd, i / steps);
          pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
        }
        return pts;
      }

      function sampleEllipseArc(cx, cy, rx, ry, aStart, aEnd, steps = 16) {
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const a = lerp(aStart, aEnd, i / steps);
          pts.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry });
        }
        return pts;
      }

      function sampleCurveX(x0, x1, steps, fn) {
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const x = lerp(x0, x1, i / steps);
          pts.push({ x, y: fn(x) });
        }
        return pts;
      }

      function chaikinSmooth(pts, closed = false, passes = 2) {
        let cur = pts.map((p) => ({ x: p.x, y: p.y }));
        for (let pass = 0; pass < passes; pass++) {
          const out = [];
          const len = cur.length;
          if (!closed) out.push(cur[0]);
          const limit = closed ? len : len - 1;
          for (let i = 0; i < limit; i++) {
            const p0 = cur[i];
            const p1 = cur[(i + 1) % len];
            out.push({ x: lerp(p0.x, p1.x, 0.25), y: lerp(p0.y, p1.y, 0.25) });
            out.push({ x: lerp(p0.x, p1.x, 0.75), y: lerp(p0.y, p1.y, 0.75) });
          }
          if (!closed) out.push(cur[len - 1]);
          cur = out;
        }
        return cur;
      }

      function doubleValleyY(x, base = 436, crest = 430, depth = 40, leftX = 180, rightX = 1100, ledge = 135) {
        const cx = 640;
        const span = (cx - leftX) - ledge;
        const d = Math.abs(x - cx);
        if (d >= span) return base;
        const t = d / span;
        const midline = lerp(crest, base, 0.5 * (1 - Math.cos(Math.PI * t)));
        const dip = depth * 0.5 * (1 - Math.cos(2 * Math.PI * t));
        return midline + dip;
      }

      function caterpillar3PeakY(x) {
        // Continuous smooth 3-peak + flanking outer-dome caterpillar wave (zero V-notch steps)
        const d = Math.abs(x - 640);
        const u = clamp(d / 445, 0, 1);
        // Cos peaks at d=0 (crest), d~195 (side peaks), d~420 (rounded spawn domes)
        const wave = -24 * Math.cos(u * Math.PI * 4.3);
        const outerLift = u > 0.65 ? -28 * Math.pow((u - 0.65) / 0.35, 1.5) : 0;
        const centerBoost = d < 95 ? -14 * Math.cos((d / 95) * Math.PI * 0.5) : 0;
        return 492 + wave + outerLift + centerBoost;
      }

      function cavernFloor4DipY(x) {
        // Gentle 4-dip / 3-crest cavern floor between x=170 and x=1110
        const u = clamp((x - 165) / 950, 0, 1);
        return 542 + 16 * Math.sin(u * Math.PI * 7 - Math.PI * 0.5);
      }

      function cloverFloorY(x) {
        const u = (x - 640) / 460;
        if (Math.abs(u) >= 1) return 546;
        return 544 + 28 * (0.5 - 0.5 * Math.cos(2 * Math.PI * u)) - 18 * Math.cos(Math.PI * u);
      }

      function makeCloverInteriorLoop() {
        // Counter-clockwise continuous smooth loop of the 3-lobed enclosed cave interior
        const pts = [];
        pts.push(...sampleCurveX(230, 1050, 28, cloverFloorY));
        pts.push(...sampleEllipseArc(1055, 455, 118, 90, Math.PI * 0.45, -Math.PI * 0.45, 10));
        pts.push({ x: 1035, y: 335 });
        pts.push(...sampleEllipseArc(905, 215, 165, 112, 0.28, -Math.PI * 0.85, 12));
        pts.push({ x: 688, y: 170 });
        pts.push({ x: 640, y: 205 });
        pts.push({ x: 592, y: 170 });
        pts.push(...sampleEllipseArc(375, 215, 165, 112, -Math.PI * 0.15, -Math.PI * 1.28, 12));
        pts.push({ x: 245, y: 335 });
        pts.push(...sampleEllipseArc(225, 455, 118, 90, -Math.PI * 0.55, -Math.PI * 1.45, 10));
        return chaikinSmooth(pts, true, 2);
      }

      function makeOvalCapsuleLoop(cx = 640, cy = 355, halfStraight = 265, r = 215) {
        const pts = [];
        for (let i = 0; i <= 20; i++) {
          const x = lerp(cx - halfStraight, cx + halfStraight, i / 20);
          const u = (x - cx) / halfStraight;
          const y = (cy + r) - 10 * Math.cos(u * Math.PI * 1.5);
          pts.push({ x, y });
        }
        pts.push(...sampleEllipseArc(cx + halfStraight, cy, r + 15, r, Math.PI * 0.48, -Math.PI * 0.48, 16));
        for (let i = 1; i <= 18; i++) {
          const x = lerp(cx + halfStraight, cx - halfStraight, i / 18);
          pts.push({ x, y: (cy - r) - 12 * Math.cos(((x - cx) / halfStraight) * Math.PI * 0.5) });
        }
        pts.push(...sampleEllipseArc(cx - halfStraight, cy, r + 15, r, -Math.PI * 0.52, -Math.PI * 1.48, 16));
        return chaikinSmooth(pts, true, 1);
      }

      function makeCavernArchOpenWalls(floorFn, lipXLeft = 405, lipXRight = 875, _topY = 92) {
        // Silky-smooth cave arch walls rising gently off top viewport around central skylight
        const raw = [];
        raw.push({ x: lipXLeft, y: -18 });

        raw.push(...sampleEllipseArc(lipXRight, 285, 250, 215, 0.08, -Math.PI * 0.48, 12));
        raw.push({ x: lipXRight, y: -18 });
        const surface = chaikinSmooth(raw, false, 2);

        const visualPoly = [
          { x: lipXLeft, y: -25 },
          { x: -25, y: -25 },
          { x: -25, y: 745 },
          { x: 1305, y: 745 },
          { x: 1305, y: -25 },
          { x: lipXRight, y: -25 },
          ...surface.slice().reverse()
        ];
        return { surface, visualPoly };
      }

      function makeCanyonWallPair(floorFn, lipXLeft = 325, lipXRight = 955) {
        const raw = [];
        raw.push({ x: lipXLeft, y: -18 });
        raw.push(...sampleEllipseArc(320, 265, 180, 240, -Math.PI * 0.52, -Math.PI * 1.20, 14));
        raw.push(...sampleCurveX(185, 1095, 32, floorFn));
        raw.push(...sampleEllipseArc(960, 265, 180, 240, 0.20, -Math.PI * 0.48, 14));
        raw.push({ x: lipXRight, y: -18 });
        const surface = chaikinSmooth(raw, false, 1);

        const visualPoly = [
          { x: lipXLeft, y: -25 },
          { x: -25, y: -25 },
          { x: -25, y: 745 },
          { x: 1305, y: 745 },
          { x: 1305, y: -25 },
          { x: lipXRight, y: -25 },
          ...surface.slice().reverse()
        ];
        return { surface, visualPoly };
      }

      const ARENAS = Object.freeze([
        // 1. Classic Double-Valley Floating Island
        (() => {
          const top = sampleCurveX(180, 1100, 32, (x) => doubleValleyY(x));

          });
        })()
      ]);

      // =========================================================================
      // 4. VEHICLE PHYSICS CONTROLLER & MATTER.JS SIMULATION
      // =========================================================================
      const BODY_KEYS = Object.freeze([
        ['p1Car', 'chassis', 'c1'], ['p1Car', 'wheelR', 'w1r'], ['p1Car', 'wheelF', 'w1f'], ['p1Car', 'head', 'h1'],
        ['p2Car', 'chassis', 'c2'], ['p2Car', 'wheelR', 'w2r'], ['p2Car', 'wheelF', 'w2f'], ['p2Car', 'head', 'h2']
      ]);

      class VehiclePhysicsController {
        constructor(BodyApi, QueryApi, engine) {
          this.Body = BodyApi;
          this.Query = QueryApi;
          this.engine = engine;
        }

        _probeWheelRay(wheel, carDown, driveBodies) {
          if (!driveBodies || driveBodies.length === 0) return null;
          const start = wheel.position;
          const probeDist = CAR_SPEC.wheelRadius + 3.5;
          const end = {
            x: start.x + carDown.x * probeDist,
            y: start.y + carDown.y * probeDist
          };
          const hits = this.Query.ray(driveBodies, start, end, 4);
          if (!hits || hits.length === 0) return null;

          const carUpX = -carDown.x;
          const carUpY = -carDown.y;
          let bestN = null;
          let bestDot = -1;

          for (let i = 0; i < hits.length; i++) {
            const h = hits[i];
            let nx = h.normal ? h.normal.x : carUpX;
            let ny = h.normal ? h.normal.y : carUpY;
            if (nx * carDown.x + ny * carDown.y > 0) {
              nx = -nx;
              ny = -ny;
            }
            const len = Math.hypot(nx, ny);
            if (len < 0.001) continue;
            nx /= len;
            ny /= len;
            const upDot = nx * carUpX + ny * carUpY;
            if (upDot > 0.20 && upDot > bestDot) {
              bestDot = upDot;
              bestN = { x: nx, y: ny };
            }
          }
          return bestN;
        }

        detectGroundState(car, wheelContacts, driveBodies) {
          const angle = car.chassis.angle;
          const carDown = { x: -Math.sin(angle), y: Math.cos(angle) };
          const carUp = { x: Math.sin(angle), y: -Math.cos(angle) };

          let rearGrounded = false;
          let frontGrounded = false;
          let sumNx = 0;
          let sumNy = 0;

          const checkWheel = (wheel, contact) => {
            if (contact && contact.count > 0) {
              const len = Math.hypot(contact.nx, contact.ny);
              if (len > 0.001) {
                const nx = contact.nx / len;
                const ny = contact.ny / len;
                if (nx * carUp.x + ny * carUp.y > 0.15) {
                  return { grounded: true, nx, ny };
                }
              }
            }
            const rayNormal = this._probeWheelRay(wheel, carDown, driveBodies);
            if (rayNormal) {
              return { grounded: true, nx: rayNormal.x, ny: rayNormal.y };
            }
            return { grounded: false, nx: 0, ny: 0 };
          };

          const rRes = checkWheel(car.wheelR, wheelContacts.rear);
          const fRes = checkWheel(car.wheelF, wheelContacts.front);

          if (rRes.grounded) {
            rearGrounded = true;
            sumNx += rRes.nx;
            sumNy += rRes.ny;
          }
          if (fRes.grounded) {
            frontGrounded = true;
            sumNx += fRes.nx;
            sumNy += fRes.ny;
          }

          const groundedCount = (rearGrounded ? 1 : 0) + (frontGrounded ? 1 : 0);
          const grounded = groundedCount > 0;

          if (grounded) {
            const len = Math.hypot(sumNx, sumNy) || 1;
            const targetNx = sumNx / len;
            const targetNy = sumNy / len;
            // Smooth ground normal so polygon seams do not jerk slope calculations
            const blendNx = lerp(car.groundNormal.x, targetNx, 0.45);
            const blendNy = lerp(car.groundNormal.y, targetNy, 0.45);
            const bLen = Math.hypot(blendNx, blendNy) || 1;
            car.groundNormal = { x: blendNx / bLen, y: blendNy / bLen };
            car.groundAngle = Math.atan2(car.groundNormal.x, -car.groundNormal.y);
            car.airTicks = 0;
          } else {
            car.airTicks += 1;
            car.groundNormal = {
              x: lerp(car.groundNormal.x, 0, 0.04),
              y: lerp(car.groundNormal.y, -1, 0.04)
            };
            const nLen = Math.hypot(car.groundNormal.x, car.groundNormal.y) || 1;
            car.groundNormal.x /= nLen;
            car.groundNormal.y /= nLen;
            car.groundAngle = Math.atan2(car.groundNormal.x, -car.groundNormal.y);
          }

          car.isAirborne = !grounded;
          return {
            grounded,
            groundedCount,
            rearGrounded,
            frontGrounded,
            normal: car.groundNormal,
            groundAngle: car.groundAngle
          };
        }

        _applyPitchStability(car, groundAngle, targetNoseLift, extraAntiFlip = false) {
          const relPitch = normalizeAngle(car.chassis.angle - groundAngle);
          const noseLift = -car.facing * relPitch;
          const liftVel = -car.facing * car.chassis.angularVelocity;

          const err = targetNoseLift - noseLift;
          const kp = extraAntiFlip && noseLift > 0.04 ? VEHICLE_PHYSICS.PITCH_KP * 1.65 : VEHICLE_PHYSICS.PITCH_KP;
          const kd = extraAntiFlip && noseLift > 0.04 ? VEHICLE_PHYSICS.PITCH_KD * 1.35 : VEHICLE_PHYSICS.PITCH_KD;
          const torque = clamp(err * kp - liftVel * kd, -VEHICLE_PHYSICS.PITCH_TORQUE_LIMIT, VEHICLE_PHYSICS.PITCH_TORQUE_LIMIT);
          const nextAv = clamp(car.chassis.angularVelocity + (-car.facing * torque), -VEHICLE_PHYSICS.MAX_ANGULAR_VELOCITY, VEHICLE_PHYSICS.MAX_ANGULAR_VELOCITY);
          this.Body.setAngularVelocity(car.chassis, nextAv);
        }

        clampAirborneAndMaxSpeed(car) {
          if (!car) return;
          if (car.isAirborne) {
            const clampedAv = clamp(
              car.chassis.angularVelocity,
              -VEHICLE_PHYSICS.AIR_MAX_SPIN,
              VEHICLE_PHYSICS.AIR_MAX_SPIN
            );
            if (clampedAv !== car.chassis.angularVelocity) {
              this.Body.setAngularVelocity(car.chassis, clampedAv);
            }
          } else if (car.accelDir !== 0 && !car.dead) {
            // Strict post-solver max speed threshold prevents downhill/wheel rocket overshoot
            const isRev = (car.accelDir * car.facing) < 0;
            const maxS = isRev ? VEHICLE_PHYSICS.MAX_REVERSE_SPEED : VEHICLE_PHYSICS.MAX_FORWARD_SPEED;
            const tx = -car.groundNormal.y;
            const ty = car.groundNormal.x;
            const vT = car.chassis.velocity.x * tx + car.chassis.velocity.y * ty;
            const vAlong = car.accelDir * vT;
            if (vAlong > maxS) {
              const trim = vAlong - maxS;
              const dx = car.accelDir * tx * trim;
              const dy = car.accelDir * ty * trim;
              for (const b of [car.chassis, car.wheelR, car.wheelF, car.head]) {
                this.Body.setVelocity(b, { x: b.velocity.x - dx, y: b.velocity.y - dy });
              }
            }
          }
          // Strict hard speed ceiling prevents rocket launches across rigid-body collisions
          for (const body of [car.chassis, car.wheelR, car.wheelF, car.head]) {
            const spd = Math.hypot(body.velocity.x, body.velocity.y);
            if (spd > VEHICLE_PHYSICS.MAX_WORLD_SPEED) {
              const scale = VEHICLE_PHYSICS.MAX_WORLD_SPEED / spd;
              this.Body.setVelocity(body, { x: body.velocity.x * scale, y: body.velocity.y * scale });
            }
          }
        }

        updateVehicle(car, inputCmd, wheelContacts, driveBodies) {
          if (!car || car.dead) {
            if (car) {
              car.driving = false;
              car.accelHoldMs = 0;
              car.accelDir = 0;
            }
            return { grounded: false, rearGrounded: false, frontGrounded: false };
          }

          const inputL = !!(inputCmd && inputCmd.l);
          const inputR = !!(inputCmd && inputCmd.r);
          const ground = this.detectGroundState(car, wheelContacts, driveBodies);
          const worldDir = (inputR ? 1 : 0) - (inputL ? 1 : 0);
          car.driving = worldDir !== 0;

          if (!ground.grounded) {
            // Strictly airborne: ZERO horizontal drive forces; apply clamped mid-air pitch rotation torque
            car.wheelR.friction = VEHICLE_PHYSICS.WHEEL_BASE_FRICTION;
            car.wheelF.friction = VEHICLE_PHYSICS.WHEEL_BASE_FRICTION;
            if (worldDir === 0) {
              car.accelHoldMs = Math.max(0, car.accelHoldMs - FIXED_DT * 0.6);
            }

            // Explicit forward (dip front wheel down) vs reverse (lift front wheel up) pitch torque
            const forwardPressed = car.facing > 0 ? inputR : inputL;
            const reversePressed = car.facing > 0 ? inputL : inputR;
            const pitchCmd = (forwardPressed ? 1 : 0) - (reversePressed ? 1 : 0);
            const torqueDir = pitchCmd * car.facing;

            if (torqueDir !== 0) {
              const clampedTorque = clamp(
                torqueDir * VEHICLE_PHYSICS.AIR_PITCH_TORQUE,
                -VEHICLE_PHYSICS.MAX_AIR_TORQUE,
                VEHICLE_PHYSICS.MAX_AIR_TORQUE
              );
              car.chassis.torque += clampedTorque;
            } else {
              this.Body.setAngularVelocity(
                car.chassis,
                clamp(
                  car.chassis.angularVelocity * VEHICLE_PHYSICS.AIR_ANGULAR_DAMPING,
                  -VEHICLE_PHYSICS.AIR_MAX_SPIN,
                  VEHICLE_PHYSICS.AIR_MAX_SPIN
                )
              );
            }
            return ground;
          }

          // World +X terrain tangent perpendicular to outward normal (nx, ny)
          const tx = -ground.normal.y;
          const ty = ground.normal.x;
          const vT = car.chassis.velocity.x * tx + car.chassis.velocity.y * ty;

          if (worldDir === 0) {
            // Smooth ease-out when throttle is released: decay hold duration + gentle rolling drag
            car.accelDir = 0;
            car.accelHoldMs = Math.max(0, car.accelHoldMs - FIXED_DT * VEHICLE_PHYSICS.ACCEL_RELEASE_DECAY);
            car.wheelR.friction = VEHICLE_PHYSICS.WHEEL_BASE_FRICTION;
            car.wheelF.friction = VEHICLE_PHYSICS.WHEEL_BASE_FRICTION;

            this.Body.setAngularVelocity(car.wheelR, car.wheelR.angularVelocity * 0.955);
            this.Body.setAngularVelocity(car.wheelF, car.wheelF.angularVelocity * 0.955);
            if (Math.abs(vT) > 0.05) {
              const dragMag = clamp(Math.abs(vT) * VEHICLE_PHYSICS.COAST_DRAG_COEFF, 0.0004, 0.014);
              const dragSign = vT > 0 ? -1 : 1;
              this.Body.applyForce(car.chassis, car.chassis.position, {
                x: tx * dragSign * dragMag,
                y: ty * dragSign * dragMag
              });
            }
            this.Body.setAngularVelocity(
              car.chassis,
              clamp(car.chassis.angularVelocity * VEHICLE_PHYSICS.GROUND_ANGULAR_DAMPING, -VEHICLE_PHYSICS.MAX_ANGULAR_VELOCITY, VEHICLE_PHYSICS.MAX_ANGULAR_VELOCITY)
            );
            return ground;
          }

          const driveT = { x: worldDir * tx, y: worldDir * ty };
          const vAlong = worldDir * vT;
          const uphillFactor = clamp(-driveT.y, 0, 1);
          const isReverse = (worldDir * car.facing) < 0;

          // Dynamic slope traction increase during uphill throttle
          const activeFriction = clamp(VEHICLE_PHYSICS.WHEEL_BASE_FRICTION + uphillFactor * 0.04, 0.96, 1.0);
          car.wheelR.friction = activeFriction;
          car.wheelF.friction = activeFriction;

          // Smooth Brake-to-Reverse until tangential velocity crosses zero
          if (vAlong < -VEHICLE_PHYSICS.BRAKE_ZERO_THRESHOLD) {
            car.accelHoldMs = 0;
            car.accelDir = worldDir;
            const brakeScale = clamp((-vAlong) / 2.2, 0.35, 1.0);
            const brakeMag = VEHICLE_PHYSICS.BRAKE_DECEL_FORCE * brakeScale;

            this.Body.setAngularVelocity(car.wheelR, car.wheelR.angularVelocity * 0.60);
            this.Body.setAngularVelocity(car.wheelF, car.wheelF.angularVelocity * 0.60);

            this.Body.applyForce(car.chassis, car.chassis.position, {
              x: driveT.x * brakeMag * 0.54,
              y: driveT.y * brakeMag * 0.54
            });
            if (ground.rearGrounded) {
              this.Body.applyForce(car.wheelR, car.wheelR.position, {
                x: driveT.x * brakeMag * 0.23,
                y: driveT.y * brakeMag * 0.23
              });
            }
            if (ground.frontGrounded) {
              this.Body.applyForce(car.wheelF, car.wheelF.position, {
                x: driveT.x * brakeMag * 0.23,
                y: driveT.y * brakeMag * 0.23
              });
            }

            this._applyPitchStability(car, ground.groundAngle, 0, true);
            return ground;
          }

          // Progressive input-duration acceleration curve (eliminates rocket snap)
          if (car.accelDir !== worldDir) {
            car.accelDir = worldDir;
            const rawHold = inputCmd && typeof inputCmd.holdMs === 'number' ? inputCmd.holdMs : 0;
            car.accelHoldMs = clamp(rawHold, FIXED_DT, VEHICLE_PHYSICS.ACCEL_RAMP_MS);
          } else {
            car.accelHoldMs = clamp(car.accelHoldMs + FIXED_DT, 0, VEHICLE_PHYSICS.ACCEL_RAMP_MS);
          }

          const rampU = clamp(car.accelHoldMs / VEHICLE_PHYSICS.ACCEL_RAMP_MS, 0, 1);
          const smoothStep = rampU * rampU * (3 - 2 * rampU);
          const progressiveGain = VEHICLE_PHYSICS.ACCEL_MIN_GAIN + (1 - VEHICLE_PHYSICS.ACCEL_MIN_GAIN) * smoothStep;

          // 25% reduced speed ceilings + curved torque falloff
          const maxSpeed = isReverse ? VEHICLE_PHYSICS.MAX_REVERSE_SPEED : VEHICLE_PHYSICS.MAX_FORWARD_SPEED;
          const baseTorque = isReverse ? VEHICLE_PHYSICS.REVERSE_TORQUE : VEHICLE_PHYSICS.FORWARD_TORQUE;
          const maxWheelSpin = isReverse ? VEHICLE_PHYSICS.WHEEL_REVERSE_MAX_SPIN : VEHICLE_PHYSICS.WHEEL_MAX_SPIN;

          const speedRatio = clamp(vAlong / maxSpeed, 0, 1.25);
          const lowEndMultiplier = 1.0 - 0.56 * clamp(speedRatio, 0, 1);
          const slopeClimbBoost = 1.0 + uphillFactor * (VEHICLE_PHYSICS.SLOPE_GRIP_MULTIPLIER - 1.0);
          const contactScale = ground.groundedCount === 2 ? 1.0 : 0.75;

          const totalMass = car.chassis.mass + car.wheelR.mass + car.wheelF.mass + car.head.mass;
          const gravityComp = totalMass * this.engine.gravity.y * 0.001 * uphillFactor * VEHICLE_PHYSICS.GRAVITY_COMP_SCALE * (0.45 + 0.55 * progressiveGain);

          let tangentForce = 0;
          if (vAlong < maxSpeed) {
            tangentForce = (baseTorque * progressiveGain * lowEndMultiplier * slopeClimbBoost + gravityComp) * contactScale;
          } else {
            // Strict max-speed threshold clamp prevents overspeed on crests & slopes
            const excess = vAlong - maxSpeed;
            const trim = Math.min(excess, excess * 0.65 + 0.15);
            if (trim > 0.001) {
              this.Body.setVelocity(car.chassis, {
                x: car.chassis.velocity.x - driveT.x * trim,
                y: car.chassis.velocity.y - driveT.y * trim
              });
            }
          }

          // Wheel spin tracks progressive throttle ramp cleanly without instant tire burnout
          const targetWheelSpeed = Math.min(maxSpeed, Math.max(vAlong + 0.9, maxSpeed * progressiveGain));
          const targetWheelSpin = worldDir * clamp((targetWheelSpeed / CAR_SPEC.wheelRadius) * 1.06, 0.08, maxWheelSpin);
          this.Body.setAngularVelocity(car.wheelR, lerp(car.wheelR.angularVelocity, targetWheelSpin, 0.30));
          this.Body.setAngularVelocity(car.wheelF, lerp(car.wheelF.angularVelocity, targetWheelSpin, 0.30));

          // Distribute longitudinal climbing force smoothly across chassis + nose/tail wheels
          const noseWheel = car.facing > 0 ? car.wheelF : car.wheelR;
          const tailWheel = car.facing > 0 ? car.wheelR : car.wheelF;
          const noseGrounded = car.facing > 0 ? ground.frontGrounded : ground.rearGrounded;
          const tailGrounded = car.facing > 0 ? ground.rearGrounded : ground.frontGrounded;

          const chassisFrac = 0.50;
          let tailFrac = isReverse ? 0.20 : 0.28;
          let noseFrac = isReverse ? 0.30 : 0.22;
          if (tailGrounded && !noseGrounded) {
            tailFrac += noseFrac * 0.65;
            noseFrac = 0;
          } else if (noseGrounded && !tailGrounded) {
            noseFrac += tailFrac * 0.65;
            tailFrac = 0;
          }

          if (tangentForce > 0) {
            this.Body.applyForce(car.chassis, car.chassis.position, {
              x: driveT.x * tangentForce * chassisFrac,
              y: driveT.y * tangentForce * chassisFrac
            });
            if (tailFrac > 0) {
              this.Body.applyForce(tailWheel, tailWheel.position, {
                x: driveT.x * tangentForce * tailFrac,
                y: driveT.y * tangentForce * tailFrac
              });
            }
            if (noseFrac > 0) {
              this.Body.applyForce(noseWheel, noseWheel.position, {
                x: driveT.x * tangentForce * noseFrac,
                y: driveT.y * tangentForce * noseFrac
              });
            }
          }

          // Gentle surface-normal tire adhesion on curved slopes & loop walls
          if (uphillFactor > 0.10 || ground.normal.y > -0.92) {
            const stick = VEHICLE_PHYSICS.CURVE_ADHESION_FORCE * clamp(Math.abs(vAlong) / maxSpeed, 0.25, 1.0);
            this.Body.applyForce(car.chassis, car.chassis.position, {
              x: -ground.normal.x * stick,
              y: -ground.normal.y * stick
            });
          }

          // Pitch Stability: planted on slopes and reverse climbs
          if (isReverse) {
            this._applyPitchStability(car, ground.groundAngle, -VEHICLE_PHYSICS.REVERSE_PITCH_BIAS, true);
          } else {
            const forwardTargetLift = clamp(0.02 + uphillFactor * 0.07, 0, VEHICLE_PHYSICS.FORWARD_PITCH_MAX_OFFSET);
            this._applyPitchStability(car, ground.groundAngle, forwardTargetLift, false);
          }

          return ground;
        }
      }

      class PhysicsSimulation {
        constructor(isHostSide = true) {
          this.isHostSide = isHostSide;
          this.Engine = Matter.Engine;
          this.Bodies = Matter.Bodies;
          this.Body = Matter.Body;
          this.Composite = Matter.Composite;
          this.Constraint = Matter.Constraint;
          this.Events = Matter.Events;
          this.Query = Matter.Query;

          this.engine = this.Engine.create({
            gravity: { x: 0, y: 1.25 },
            positionIterations: 8,
            velocityIterations: 6,
            constraintIterations: 4
          });
          this.vehicleController = new VehiclePhysicsController(this.Body, this.Query, this.engine);

          this.arenaIndex = 0;
          this.seesaws = [];
          this.driveSurfaces = [];
          this.p1Car = null;
          this.p2Car = null;
          this.grounded = { p1R: false, p1F: false, p2R: false, p2F: false };
          this.wheelContacts = {
            p1: { rear: { count: 0, nx: 0, ny: 0 }, front: { count: 0, nx: 0, ny: 0 } },
            p2: { rear: { count: 0, nx: 0, ny: 0 }, front: { count: 0, nx: 0, ny: 0 } }
          };

          this.onHeadKO = null;
          this.onWaterKO = null;
          this.onCarBump = null;
          this._bindEvents();
        }

        _resetWheelContacts() {
          for (const pk of ['p1', 'p2']) {
            for (const wk of ['rear', 'front']) {
              const c = this.wheelContacts[pk][wk];
              c.count = 0;
              c.nx = 0;
              c.ny = 0;
            }
          }
        }

        _bindEvents() {
          this.Events.on(this.engine, 'beforeUpdate', () => {
            this._resetWheelContacts();
          });

          const addWheelContact = (wheel, pKey, wKey, pair) => {
            const sup = pair.collision && pair.collision.supports && pair.collision.supports[0];
            let nx = 0;
            let ny = -1;
            if (sup) {
              const dx = wheel.position.x - sup.x;
              const dy = wheel.position.y - sup.y;
              const len = Math.hypot(dx, dy);
              if (len > 0.2) {
                nx = dx / len;
                ny = dy / len;
              }
            }
            const bucket = this.wheelContacts[pKey][wKey];
            bucket.count += 1;
            bucket.nx += nx;
            bucket.ny += ny;
          };

          this.Events.on(this.engine, 'collisionActive', (ev) => {
            for (let i = 0; i < ev.pairs.length; i++) {
              const pair = ev.pairs[i];
              const a = pair.bodyA;
              const b = pair.bodyB;
              const la = a.label || '';
              const lb = b.label || '';
              const solidA = la === 'island' || la === 'seesaw' || la.includes('_p');
              const solidB = lb === 'island' || lb === 'seesaw' || lb.includes('_p');

              if (la === 'wheel_p1_r' && solidB && !lb.includes('_p1')) addWheelContact(a, 'p1', 'rear', pair);
              if (lb === 'wheel_p1_r' && solidA && !la.includes('_p1')) addWheelContact(b, 'p1', 'rear', pair);
              if (la === 'wheel_p1_f' && solidB && !lb.includes('_p1')) addWheelContact(a, 'p1', 'front', pair);
              if (lb === 'wheel_p1_f' && solidA && !la.includes('_p1')) addWheelContact(b, 'p1', 'front', pair);

              if (la === 'wheel_p2_r' && solidB && !lb.includes('_p2')) addWheelContact(a, 'p2', 'rear', pair);
              if (lb === 'wheel_p2_r' && solidA && !la.includes('_p2')) addWheelContact(b, 'p2', 'rear', pair);
              if (la === 'wheel_p2_f' && solidB && !lb.includes('_p2')) addWheelContact(a, 'p2', 'front', pair);
              if (lb === 'wheel_p2_f' && solidA && !la.includes('_p2')) addWheelContact(b, 'p2', 'front', pair);
            }
          });

          this.Events.on(this.engine, 'collisionStart', (ev) => {
            if (!this.isHostSide) return;
            for (let i = 0; i < ev.pairs.length; i++) {
              const pair = ev.pairs[i];
              const a = pair.bodyA;
              const b = pair.bodyB;
              const la = a.label || '';
              const lb = b.label || '';

              if (la === 'head_p1' || lb === 'head_p1') {
                const other = la === 'head_p1' ? b : a;
                const ol = other.label || '';
                if (ol === 'island' || ol === 'seesaw' || ol.endsWith('_p2') || ol.includes('_p2_')) {
                  const pt = (pair.collision.supports && pair.collision.supports[0]) || a.position;
                  if (this.onHeadKO) this.onHeadKO(1, pt);
                }
              }
              if (la === 'head_p2' || lb === 'head_p2') {
                const other = la === 'head_p2' ? b : a;
                const ol = other.label || '';
                if (ol === 'island' || ol === 'seesaw' || ol.endsWith('_p1') || ol.includes('_p1_')) {
                  const pt = (pair.collision.supports && pair.collision.supports[0]) || b.position;
                  if (this.onHeadKO) this.onHeadKO(2, pt);
                }
              }

              if (
                (la.startsWith('chassis_p') || la.startsWith('wheel_p')) &&
                (lb.startsWith('chassis_p') || lb.startsWith('wheel_p') || lb === 'seesaw')
              ) {
                const spd = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
                if (spd > 2.5 && this.onCarBump) {
                  const pt = (pair.collision.supports && pair.collision.supports[0]) || a.position;
                  this.onCarBump(pt, clamp(spd / 12, 0.2, 1.0));
                }
              }
            }
          });
        }

        _addSurfacePolyline(pts, inwardSign = 1, thickness = 34, closeLoop = false) {
          const count = closeLoop ? pts.length : pts.length - 1;
          for (let i = 0; i < count; i++) {
            const p0 = pts[i];
            const p1 = pts[(i + 1) % pts.length];
            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;
            const segLen = Math.hypot(dx, dy);
            if (segLen < 1) continue;
            const angle = Math.atan2(dy, dx);
            const nx = -Math.sin(angle) * inwardSign;
            const ny = Math.cos(angle) * inwardSign;
            const cx = (p0.x + p1.x) * 0.5 + nx * (thickness * 0.5);
            const cy = (p0.y + p1.y) * 0.5 + ny * (thickness * 0.5);

            const rect = this.Bodies.rectangle(cx, cy, segLen + 10, thickness, {
              isStatic: true,
              angle,
              chamfer: { radius: 6 },
              friction: 1.0,
              restitution: 0.08,
              slop: 0.02,
              label: 'island'
            });
            this.Composite.add(this.engine.world, rect);
            this.driveSurfaces.push(rect);
          }
        }

        _addHalfPipeColliders(pipe) {
          const steps = 18;
          const pts = sampleArcPoints(pipe.cx, pipe.cy, pipe.r, pipe.aStart, pipe.aEnd, steps);
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i];
            const p1 = pts[i + 1];
            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;
            const segLen = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            const cx = (p0.x + p1.x) * 0.5;
            const cy = (p0.y + p1.y) * 0.5;
            const seg = this.Bodies.rectangle(cx, cy, segLen + 8, pipe.thickness, {
              isStatic: true,
              angle,
              chamfer: { radius: 6 },
              friction: 1.0,
              restitution: 0.10,
              slop: 0.02,
              label: 'island'
            });
            this.Composite.add(this.engine.world, seg);
            this.driveSurfaces.push(seg);
          }
          for (const endPt of [pts[0], pts[pts.length - 1]]) {
            const cap = this.Bodies.circle(endPt.x, endPt.y, pipe.thickness * 0.5, {
              isStatic: true,
              friction: 1.0,
              restitution: 0.10,
              label: 'island'
            });
            this.Composite.add(this.engine.world, cap);
            this.driveSurfaces.push(cap);
          }
        }

        _addSeesaw(cfg) {
          const plank = this.Bodies.rectangle(cfg.x, cfg.y, cfg.w, 28, {
            density: 0.0042,
            chamfer: { radius: 14 },
            friction: 1.0,
            restitution: 0.10,
            frictionAir: 0.012,
            slop: 0.02,
            angle: cfg.angle || 0,
            label: 'seesaw'
          });
          const pivot = this.Constraint.create({
            pointA: { x: cfg.x, y: cfg.y },
            bodyB: plank,
            pointB: { x: 0, y: 0 },
            stiffness: 1.0,
            length: 0
          });
          this.Composite.add(this.engine.world, [plank, pivot]);
          this.seesaws.push({ body: plank, x: cfg.x, y: cfg.y, w: cfg.w });
          this.driveSurfaces.push(plank);
        }

        resetArena(arenaIndex = this.arenaIndex) {
          this.arenaIndex = ((arenaIndex % ARENAS.length) + ARENAS.length) % ARENAS.length;
          const arena = ARENAS[this.arenaIndex];

          this.Composite.clear(this.engine.world, false);
          this.engine.timing.timeScale = 1.0;
          this.seesaws = [];
          this.driveSurfaces = [];
          this.grounded = { p1R: false, p1F: false, p2R: false, p2F: false };
          this._resetWheelContacts();

          for (const isl of arena.islands) {
            this._addSurfacePolyline(isl.top, 1, 34, false);
            this._addSurfacePolyline(isl.belly, 1, 24, false);
          }

          for (const caveLoop of arena.caves) {
            this._addSurfacePolyline(caveLoop, 1, 72, true);
            const backupWalls = [
              this.Bodies.rectangle(WORLD_W / 2, -50, WORLD_W + 200, 100, { isStatic: true, friction: 1.0, label: 'island' }),
              this.Bodies.rectangle(WORLD_W / 2, WORLD_H + 50, WORLD_W + 200, 100, { isStatic: true, friction: 1.0, label: 'island' }),
              this.Bodies.rectangle(-50, WORLD_H / 2, 100, WORLD_H + 200, { isStatic: true, friction: 1.0, label: 'island' }),
              this.Bodies.rectangle(WORLD_W + 50, WORLD_H / 2, 100, WORLD_H + 200, { isStatic: true, friction: 1.0, label: 'island' })
            ];
            this.Composite.add(this.engine.world, backupWalls);
            this.driveSurfaces.push(...backupWalls);
          }

          for (const openRock of arena.openRocks) {
            this._addSurfacePolyline(openRock.surface, 1, 46, false);
            const backupWalls = [
              this.Bodies.rectangle(-50, WORLD_H / 2, 100, WORLD_H + 200, { isStatic: true, friction: 1.0, label: 'island' }),
              this.Bodies.rectangle(WORLD_W + 50, WORLD_H / 2, 100, WORLD_H + 200, { isStatic: true, friction: 1.0, label: 'island' }),
              this.Bodies.rectangle(WORLD_W / 2, WORLD_H + 55, WORLD_W + 200, 100, { isStatic: true, friction: 1.0, label: 'island' })
            ];
            this.Composite.add(this.engine.world, backupWalls);
            this.driveSurfaces.push(...backupWalls);
          }

          for (const pipe of arena.halfPipes) {
            this._addHalfPipeColliders(pipe);
          }

          for (const blk of arena.blocks) {
            const rect = this.Bodies.rectangle(blk.x, blk.y, blk.w, blk.h, {
              isStatic: true,
              angle: blk.angle || 0,
              chamfer: { radius: blk.chamfer || 4 },
              friction: 1.0,
              restitution: 0.14,
              label: 'island'
            });
            this.Composite.add(this.engine.world, rect);
            this.driveSurfaces.push(rect);
          }

          for (const sw of arena.seesaws) {
            this._addSeesaw(sw);
          }

          this.p1Car = this._buildRoadster(1, arena.p1Spawn.x, arena.p1Spawn.y);
          this.p2Car = this._buildRoadster(2, arena.p2Spawn.x, arena.p2Spawn.y);
        }

        _buildRoadster(playerIndex, x, y) {
          const facing = playerIndex === 1 ? 1 : -1;
          const pTag = playerIndex === 1 ? 'p1' : 'p2';
          const group = this.Body.nextGroup(true);

          const chassis = this.Bodies.rectangle(x, y, CAR_SPEC.width, CAR_SPEC.height, {
            chamfer: { radius: 7 },
            density: CAR_SPEC.density,
            restitution: CAR_SPEC.restitution,
            friction: CAR_SPEC.friction,
            frictionAir: 0.012,
            slop: 0.02,
            collisionFilter: { group },
            label: `chassis_${pTag}`
          });
          // Shift Center of Mass below chassis geometric center to prevent erratic tipping & somersaults
          this.Body.setCentre(chassis, { x: 0, y: CENTER_OF_MASS_OFFSET }, true);

          const wheelR = this.Bodies.circle(x - CAR_SPEC.wheelOffsetX, y + CAR_SPEC.wheelOffsetY, CAR_SPEC.wheelRadius, {
            density: CAR_SPEC.wheelDensity,
            friction: CAR_SPEC.wheelFriction,
            frictionStatic: 1.0,
            restitution: CAR_SPEC.wheelRestitution,
            frictionAir: 0.010,
            slop: 0.01,
            collisionFilter: { group },
            label: `wheel_${pTag}_r`
          });

          const wheelF = this.Bodies.circle(x + CAR_SPEC.wheelOffsetX, y + CAR_SPEC.wheelOffsetY, CAR_SPEC.wheelRadius, {
            density: CAR_SPEC.wheelDensity,
            friction: CAR_SPEC.wheelFriction,
            frictionStatic: 1.0,
            restitution: CAR_SPEC.wheelRestitution,
            frictionAir: 0.010,
            slop: 0.01,
            collisionFilter: { group },
            label: `wheel_${pTag}_f`
          });

          // Low-seated helmet resting directly on the cockpit collar (localY = -16px relative to visual body)
          const head = this.Bodies.circle(x, y + CAR_SPEC.headOffsetY, CAR_SPEC.headRadius, {
            density: CAR_SPEC.headDensity,
            restitution: CAR_SPEC.headRestitution,
            friction: 0.3,
            frictionAir: 0.008,
            collisionFilter: { group },
            label: `head_${pTag}`
          });

          // Suspension mount anchors compensated for lowered CoM (visualOffsetY = -CENTER_OF_MASS_OFFSET)
          const suspY = CAR_SPEC.wheelOffsetY - CENTER_OF_MASS_OFFSET;
          const suspRVert = this.Constraint.create({
            bodyA: chassis, pointA: { x: -CAR_SPEC.wheelOffsetX, y: suspY },
            bodyB: wheelR, pointB: { x: 0, y: 0 },
            length: 0, stiffness: VEHICLE_PHYSICS.SUSPENSION_STIFFNESS, damping: SUSPENSION_DAMPING
          });
          const suspRArm = this.Constraint.create({
            bodyA: chassis, pointA: { x: 0, y: suspY },
            bodyB: wheelR, pointB: { x: 0, y: 0 },
            length: CAR_SPEC.wheelOffsetX, stiffness: VEHICLE_PHYSICS.AXLE_ARM_STIFFNESS, damping: VEHICLE_PHYSICS.AXLE_ARM_DAMPING
          });

          const suspFVert = this.Constraint.create({
            bodyA: chassis, pointA: { x: CAR_SPEC.wheelOffsetX, y: suspY },
            bodyB: wheelF, pointB: { x: 0, y: 0 },
            length: 0, stiffness: VEHICLE_PHYSICS.SUSPENSION_STIFFNESS, damping: SUSPENSION_DAMPING
          });
          const suspFArm = this.Constraint.create({
            bodyA: chassis, pointA: { x: 0, y: suspY },
            bodyB: wheelF, pointB: { x: 0, y: 0 },
            length: CAR_SPEC.wheelOffsetX, stiffness: VEHICLE_PHYSICS.AXLE_ARM_STIFFNESS, damping: VEHICLE_PHYSICS.AXLE_ARM_DAMPING
          });

          // 3 triangulated neck constraints locking helmet snugly to seat collar
          const collarY = -2 - CENTER_OF_MASS_OFFSET;
          const neckSpine = this.Constraint.create({
            bodyA: chassis, pointA: { x: 0, y: collarY },
            bodyB: head, pointB: { x: 0, y: 0 },
            stiffness: 0.92, damping: 0.16
          });
          const neckL = this.Constraint.create({
            bodyA: chassis, pointA: { x: -16, y: collarY },
            bodyB: head, pointB: { x: 0, y: 0 },
            stiffness: 0.78, damping: 0.16
          });
          const neckR = this.Constraint.create({
            bodyA: chassis, pointA: { x: 16, y: collarY },
            bodyB: head, pointB: { x: 0, y: 0 },
            stiffness: 0.78, damping: 0.16
          });

          this.Composite.add(this.engine.world, [
            chassis, wheelR, wheelF, head,
            suspRVert, suspRArm, suspFVert, suspFArm,
            neckSpine, neckL, neckR
          ]);

          return {
            playerIndex,
            isRedPlayer: playerIndex === 1,
            facing,
            chassis,
            wheelR,
            wheelF,
            head,
            headConstraints: [neckSpine, neckL, neckR],
            headSevered: false,
            dead: false,
            airTicks: 0,
            isAirborne: false,
            accelHoldMs: 0,
            accelDir: 0,
            groundAngle: 0,
            groundNormal: { x: 0, y: -1 },
            driving: false
          };
        }

        captureCarPose(car) {
          if (!car) return null;
          const pack = (b) => ({ x: b.position.x, y: b.position.y, a: b.angle });
          return {
            c: pack(car.chassis),
            wr: pack(car.wheelR),
            wf: pack(car.wheelF),
            h: pack(car.head)
          };
        }

        blendCarPose(car, prevPose, alpha) {
          if (!car || !prevPose) return;
          const blend = (b, prev) => {
            this.Body.setPosition(b, {
              x: lerp(prev.x, b.position.x, alpha),
              y: lerp(prev.y, b.position.y, alpha)
            });
            this.Body.setAngle(b, lerpAngle(prev.a, b.angle, alpha));
          };
          blend(car.chassis, prevPose.c);
          blend(car.wheelR, prevPose.wr);
          blend(car.wheelF, prevPose.wf);
          blend(car.head, prevPose.h);
        }

        applyNetState(snap) {
          if (!snap) return;
          const applyBody = (body, st) => {
            if (!body || !st) return;
            this.Body.setPosition(body, { x: st.x, y: st.y });
            this.Body.setAngle(body, st.a);
            if (typeof st.vx === 'number' && typeof st.vy === 'number') {
              this.Body.setVelocity(body, { x: st.vx, y: st.vy });
            }
            if (typeof st.av === 'number') {
              this.Body.setAngularVelocity(body, st.av);
            }
          };

          for (const [carKey, bodyKey, shortKey] of BODY_KEYS) {
            const car = this[carKey];
            if (car && snap[shortKey]) applyBody(car[bodyKey], snap[shortKey]);
          }
          if (this.p1Car) {
            this.p1Car.driving = !!snap.dr1;
            if (typeof snap.hm1 === 'number') this.p1Car.accelHoldMs = snap.hm1;
            if (typeof snap.ad1 === 'number') this.p1Car.accelDir = snap.ad1;
          }
          if (this.p2Car) {
            this.p2Car.driving = !!snap.dr2;
            if (typeof snap.hm2 === 'number') this.p2Car.accelHoldMs = snap.hm2;
            if (typeof snap.ad2 === 'number') this.p2Car.accelDir = snap.ad2;
          }
          if (snap.sw && this.seesaws.length === snap.sw.length) {
            for (let i = 0; i < this.seesaws.length; i++) {
              this.Body.setAngle(this.seesaws[i].body, snap.sw[i].a);
              if (typeof snap.sw[i].av === 'number') {
                this.Body.setAngularVelocity(this.seesaws[i].body, snap.sw[i].av);
              }
            }
          }
        }

        popHelmet(playerIndex, impactPt) {
          const car = playerIndex === 1 ? this.p1Car : this.p2Car;
          if (!car || car.headSevered) return;
          car.headSevered = true;
          car.dead = true;

          for (const c of car.headConstraints) {
            this.Composite.remove(this.engine.world, c);
          }
          car.headConstraints = [];
          car.head.collisionFilter.group = 0;

          const dx = car.head.position.x - (impactPt ? impactPt.x : car.chassis.position.x);
          const dy = car.head.position.y - (impactPt ? impactPt.y : car.chassis.position.y);
          const len = Math.hypot(dx, dy) || 1;
          this.Body.setVelocity(car.head, {
            x: (dx / len) * 7.5,
            y: -8.2
          });
          this.Body.setAngularVelocity(car.head, -car.facing * 0.28);
        }

        step(p1Input, p2Input, canControl) {
          const empty = { l: false, r: false, holdMs: 0 };
          const activeP1 = canControl ? (p1Input || empty) : empty;
          const activeP2 = canControl ? (p2Input || empty) : empty;

          const g1 = this.vehicleController.updateVehicle(this.p1Car, activeP1, this.wheelContacts.p1, this.driveSurfaces);
          const g2 = this.vehicleController.updateVehicle(this.p2Car, activeP2, this.wheelContacts.p2, this.driveSurfaces);

          this.grounded.p1R = g1.rearGrounded;
          this.grounded.p1F = g1.frontGrounded;
          this.grounded.p2R = g2.rearGrounded;
          this.grounded.p2F = g2.frontGrounded;

          this.Engine.update(this.engine, FIXED_DT);

          this.vehicleController.clampAirborneAndMaxSpeed(this.p1Car);
          this.vehicleController.clampAirborneAndMaxSpeed(this.p2Car);

          for (const sw of this.seesaws) {
            this.Body.setAngularVelocity(sw.body, sw.body.angularVelocity * 0.985);
          }

          if (this.isHostSide) {
            const checkWater = (car, idx) => {
              if (!car || car.dead) return;
              if (car.head.position.y > WATER_HAZARD_Y || car.chassis.position.y > WATER_HAZARD_Y) {
                if (this.onWaterKO) this.onWaterKO(idx, { x: car.chassis.position.x, y: WATER_HAZARD_Y });
              }
            };
            checkWater(this.p1Car, 1);
            checkWater(this.p2Car, 2);
          }
        }
      }

      // =========================================================================
      // 5. FLAT-VECTOR CARTOON RENDERER & EXHAUST PUFFS
      // =========================================================================
      function drawRoundedRectPath(ctx, x, y, w, h, r) {
        const rad = Math.min(r, w * 0.5, h * 0.5);
        ctx.moveTo(x + rad, y);
        ctx.lineTo(x + w - rad, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
        ctx.lineTo(x + w, y + h - rad);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        ctx.lineTo(x + rad, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
        ctx.lineTo(x, y + rad);
        ctx.quadraticCurveTo(x, y, x + rad, y);
        ctx.closePath();
      }

      function tracePointLoop(path, pts, closed = true) {
        if (!pts.length) return;
        path.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) path.lineTo(pts[i].x, pts[i].y);
        if (closed) path.closePath();
      }

      function drawRoadster(ctx, carState, isRedPlayer) {
        const colors = isRedPlayer ? PALETTE.red : PALETTE.blue;
        const { facing, chassis, wheelR, wheelF, head, headSevered } = carState;

        // 1. Seated Charcoal Torso & 9px Neck Bridge (Drawn BEHIND chassis rim so helmet attaches snugly)
        const sinC = Math.sin(chassis.angle);
        const cosC = Math.cos(chassis.angle);
        const collarLocalY = -4 - CENTER_OF_MASS_OFFSET;
        const collarX = chassis.position.x - sinC * collarLocalY;
        const collarY = chassis.position.y + cosC * collarLocalY;

        if (!headSevered) {
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          // Dynamic 9px neck bridge connecting collar to live head center
          ctx.strokeStyle = PALETTE.ink;
          ctx.lineWidth = 15;
          ctx.beginPath();
          ctx.moveTo(collarX, collarY);
          ctx.lineTo(head.position.x, head.position.y);
          ctx.stroke();

          ctx.strokeStyle = PALETTE.charcoal;
          ctx.lineWidth = 9;
          ctx.beginPath();
          ctx.moveTo(collarX, collarY);
          ctx.lineTo(head.position.x, head.position.y);
          ctx.stroke();

          // Seated driver shoulders inside cockpit cutout
          ctx.translate(chassis.position.x, chassis.position.y);
          ctx.rotate(chassis.angle);
          ctx.translate(0, -CENTER_OF_MASS_OFFSET);
          ctx.fillStyle = PALETTE.charcoal;
          ctx.strokeStyle = PALETTE.ink;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.ellipse(0, -4, 13, 10, 0, Math.PI, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // 2. Helmet Head (11.5px radius, flat color, 3.5px ink outline, dark rounded front visor)
        ctx.save();
        ctx.translate(head.position.x, head.position.y);
        ctx.rotate(head.angle);
        ctx.fillStyle = colors.helmet;
        ctx.strokeStyle = PALETTE.ink;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, CAR_SPEC.headRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Rounded front visor cutout
        ctx.fillStyle = PALETTE.charcoal;
        ctx.beginPath();
        ctx.arc(facing * 5.2, -0.5, 5.2, -0.55 * Math.PI, 0.55 * Math.PI, facing < 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 3. Chassis Roadster Body (90x26), Tailpipe, Stripe, Windshield Post & Wheel Wells
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        ctx.translate(0, -CENTER_OF_MASS_OFFSET);
        ctx.scale(facing, 1);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Rear Exhaust Tailpipe Stub protruding backward-upward from rear bumper
        ctx.fillStyle = PALETTE.charcoal;
        ctx.strokeStyle = PALETTE.ink;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-40, 2);
        ctx.lineTo(-50, -3);
        ctx.lineTo(-49, 4);
        ctx.lineTo(-39, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Windshield Post (Small angled dark-outlined post in front of driver cockpit)
        ctx.fillStyle = PALETTE.white;
        ctx.strokeStyle = PALETTE.ink;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(15, -10);
        ctx.lineTo(12, -21);
        ctx.lineTo(17, -21);
        ctx.lineTo(20, -10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Main Roadster Convertible Silhouette (90 x 26)
        ctx.beginPath();
        ctx.moveTo(-38, 12);
        ctx.lineTo(38, 12);
        ctx.quadraticCurveTo(46, 12, 46, 2);
        ctx.quadraticCurveTo(46, -10, 32, -11);
        ctx.lineTo(17, -11);
        ctx.quadraticCurveTo(10, -2, 0, -2);
        ctx.quadraticCurveTo(-10, -2, -16, -12);
        ctx.lineTo(-34, -12);
        ctx.quadraticCurveTo(-45, -11, -45, 2);
        ctx.quadraticCurveTo(-45, 12, -38, 12);
        ctx.closePath();

        ctx.fillStyle = colors.body;
        ctx.fill();

        // Clip interior stripe & lower lip
        ctx.save();
